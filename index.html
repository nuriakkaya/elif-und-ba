<style>/* ============ LERN APP — Tokens & base ============ */
:root {
  /* surface */
  --bg: #F4F6FA;
  --bg-2: #EDF0F5;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --line: #E6E9EF;
  --line-2: #D8DCE5;
  /* text */
  --ink: #15192A;
  --ink-soft: #525C73;
  --ink-mute: #8E97AB;
  /* accents — slightly desaturated */
  --accent: #6B6FE0;        /* periwinkle, cooler */
  --accent-soft: #ECEDFB;
  --success: #3A9B5C;
  --success-bg: #E7F3EB;
  --warn: #E69A1F;
  --rose: #E5677A;
  --rose-bg: #FAE6E9;
  --gold: #D9A02A;
  --sapphire: #4D8FC1;
  --premium-a: #7C5BE0;
  --premium-b: #B057C9;
  /* stack palette — desaturated ~15% */
  --stack-lavender: #B8A5F0;
  --stack-blue: #A3ACEA;
  --stack-mint: #9CD9C9;
  --stack-green: #BACF93;
  --stack-yellow: #ECD18B;
  --stack-orange: #E6A877;
  --stack-rose: #E2A0AF;
  --stack-pink: #DDA3D2;
  --stack-coal: #2A2F45;
  /* radii / motion — tighter */
  --r-xs: 6px;
  --r-sm: 8px;
  --r-md: 10px;
  --r-lg: 12px;
  --r-xl: 18px;
  --r-pill: 999px;
  --shadow-1: 0 1px 2px rgba(20, 25, 50, 0.04);
  --shadow-2: 0 2px 8px rgba(20, 25, 50, 0.05), 0 1px 2px rgba(20, 25, 50, 0.03);
  --shadow-3: 0 12px 32px rgba(20, 25, 50, 0.14), 0 4px 10px rgba(20, 25, 50, 0.06);
  --ease: cubic-bezier(.2,.7,.2,1);
}

/* dark mode override */
.theme-dark {
  --bg: #0F1322;
  --bg-2: #161B30;
  --surface: #1A2038;
  --surface-2: #232A47;
  --line: #2B3253;
  --line-2: #3A4373;
  --ink: #F0F3FB;
  --ink-soft: #C3CADE;
  --ink-mute: #8A95B5;
  --accent-soft: #2B265E;
  --success-bg: #19402A;
  --rose-bg: #4A2026;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Geist', 'Scheherazade New', ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-feature-settings: 'ss01', 'cv11';
  font-size: 14.5px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  letter-spacing: -0.011em;
}

button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea { font-family: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* logo wordmark */
.logo {
  font-family: 'Geist', sans-serif;
  font-weight: 700;
  font-size: 26px;
  letter-spacing: -0.045em;
  color: var(--ink);
  font-style: normal;
}

/* primary surfaces */
.app {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: 100vh;
  background: var(--bg);
}

/* ---------- sidebar ---------- */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--bg);
  padding: 22px 18px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.sidebar .logo { margin-left: 8px; margin-bottom: 8px; }
.nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: var(--r-md);
  color: var(--ink-soft);
  font-weight: 600;
  font-size: 14.5px;
  transition: background .15s var(--ease), color .15s var(--ease);
  text-align: left;
  width: 100%;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.nav-icon { width: 30px; height: 30px; display: grid; place-items: center; flex: 0 0 30px; }

.cta-block {
  display: flex; flex-direction: column; gap: 10px;
  margin-top: 6px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: 14px;
  border: 1px solid transparent;
  transition: transform .12s var(--ease), background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);
  user-select: none;
  letter-spacing: -0.005em;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: #2a3050; }
.btn-ghost { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { filter: brightness(1.05); }
.btn-success { background: var(--success); color: #fff; }
.btn-full { width: 100%; }
.btn-lg { padding: 13px 20px; font-size: 15px; }

.stacks {
  border-top: 1px solid var(--line);
  margin-top: 8px;
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  overflow: auto;
}
.stacks-head {
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 600; font-size: 11px; color: var(--ink-mute);
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 4px 8px 8px;
}
.stack-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border-radius: var(--r-sm);
  color: var(--ink);
  font-weight: 500;
  font-size: 13.5px;
  cursor: pointer;
  position: relative;
}
.stack-row:hover { background: var(--surface-2); }
.stack-row.is-active { background: var(--surface); box-shadow: var(--shadow-1); }
.stack-row .caret { width: 14px; color: var(--ink-mute); opacity: 0; transition: opacity .1s var(--ease); }
.stack-row.has-caret .caret { opacity: 1; }
.stack-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack-dot {
  width: 12px; height: 12px; border-radius: 4px; flex: 0 0 12px;
}

/* ---------- main / header ---------- */
.main {
  display: flex; flex-direction: column;
  min-width: 0;
}
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 32px;
  position: sticky; top: 0; z-index: 4;
  background: var(--bg);
  border-bottom: 1px solid transparent;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar .spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px;
  border-radius: var(--r-pill);
  background: var(--surface);
  border: 1px solid var(--line);
  font-weight: 500;
  font-size: 13px;
  color: var(--ink);
  transition: background .15s var(--ease), border-color .15s var(--ease);
}
.pill:hover { background: var(--surface-2); }
.pill .em { font-weight: 600; }
.icon-btn {
  width: 34px; height: 34px;
  border-radius: var(--r-pill);
  background: var(--surface);
  border: 1px solid var(--line);
  display: grid; place-items: center;
  transition: background .15s var(--ease);
}
.icon-btn:hover { background: var(--surface-2); }
.avatar-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px 4px 4px;
  border-radius: var(--r-pill);
  background: var(--surface);
  border: 1px solid var(--line);
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent-soft);
  display: grid; place-items: center;
  font-size: 18px;
  overflow: hidden;
  flex: 0 0 32px;
}
.avatar.lg { width: 56px; height: 56px; font-size: 32px; flex-basis: 56px; }
.avatar.xl { width: 88px; height: 88px; font-size: 50px; flex-basis: 88px; }

/* ---------- page scaffold ---------- */
.page {
  padding: 0 32px 64px;
  display: flex; flex-direction: column;
  gap: 24px;
  max-width: 980px;
  margin: 0 auto;
  width: 100%;
}
.page.wide { max-width: 1160px; }
.page h1 { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.028em; margin: 0; line-height: 1.1; }
.page h2 { font-weight: 600; font-size: 18px; margin: 0; letter-spacing: -0.018em; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-top: 8px;
}
.section-head .title { font-weight: 600; font-size: 15.5px; letter-spacing: -0.012em; }
.section-head .link { color: var(--ink-mute); font-weight: 500; font-size: 13px; }

/* card */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: none;
}
.card.flat { box-shadow: none; }
.card.tinted { background: var(--surface-2); }

/* ---------- home / dashboard ---------- */
.home-hero {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 12px;
}
.mascot-wrap {
  width: 220px; height: 220px;
  position: relative;
  display: grid; place-items: center;
}
.mascot-wrap .shadow {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 130px; height: 14px;
  background: radial-gradient(ellipse at center, rgba(20,25,50,0.18), rgba(20,25,50,0) 70%);
}
.hero-title {
  font-family: 'Geist', sans-serif;
  font-weight: 600;
  font-size: 30px;
  text-align: center;
  letter-spacing: -0.03em;
  margin: 12px 0 18px;
}
.search-box {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 18px 12px;
  box-shadow: none;
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-box input {
  width: 100%; border: 0; outline: none; background: transparent;
  font-size: 15px; padding: 4px 0 12px;
  font-family: inherit;
}
.search-box .row { display: flex; align-items: center; gap: 8px; }
.quick-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  width: 100%;
}
.quick-btn {
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 12px;
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
  transition: transform .12s var(--ease), background .15s var(--ease);
}
.quick-btn:hover { background: var(--surface-2); transform: translateY(-1px); }

/* jump back cards */
.jumpback-row {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 300px;
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 6px;
  scroll-snap-type: x mandatory;
}
.jumpback-row::-webkit-scrollbar { height: 0; }
.jump-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
  display: flex; align-items: center; gap: 14px;
  scroll-snap-align: start;
  transition: transform .12s var(--ease), box-shadow .15s var(--ease);
  text-align: left;
}
.jump-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }

.ring {
  width: 56px; height: 56px;
  flex: 0 0 56px;
  position: relative;
  display: grid; place-items: center;
}
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .ring-bg { stroke: var(--line); }
.ring .ring-fg { stroke: var(--success); }
.ring .label {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-weight: 800; font-size: 13px;
}

.friends-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.friend-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
}
.friend-card .meta { flex: 1; min-width: 0; }
.friend-card .name { font-weight: 600; }
.friend-card .sub { color: var(--ink-mute); font-size: 13px; }

/* ---------- fortschritt ---------- */
.level-card {
  display: flex; align-items: center; gap: 18px;
  padding: 16px 20px;
}
.level-shield {
  width: 70px; height: 70px; flex: 0 0 70px;
  background: linear-gradient(180deg, #C3CFE5, #8A99BB);
  border-radius: 16px;
  display: grid; place-items: center;
  color: #fff; font-weight: 900;
  font-size: 13px;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.06);
  position: relative;
}
.level-shield::before {
  content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  font-size: 28px;
}
.xp-bar {
  flex: 1;
  height: 10px;
  background: var(--bg-2);
  border-radius: var(--r-pill);
  overflow: hidden;
  margin-top: 8px;
}
.xp-bar .fill {
  height: 100%;
  background: linear-gradient(90deg, var(--success), #5BC787);
  border-radius: inherit;
  position: relative;
}
.xp-pill {
  background: var(--success-bg); color: var(--success);
  font-weight: 800; font-size: 12px;
  padding: 4px 10px; border-radius: var(--r-pill);
  display: inline-flex; align-items: center; gap: 4px;
}

.streak-card { padding: 22px 24px; }
.streak-head { display: flex; align-items: center; justify-content: space-between; }
.streak-head h2 { font-family: 'Geist', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.022em; }
.gem-card {
  width: 160px; height: 110px;
  background: linear-gradient(135deg, #FFC25C, #E07A2E);
  border-radius: var(--r-lg);
  display: grid; place-items: center;
  color: #fff; font-weight: 900;
  position: relative; overflow: hidden;
  margin-right: -6px;
}
.gem-card.next { background: linear-gradient(135deg, #88D6F7, #4D8BC9); }
.gem-card .gem-label { position: absolute; bottom: 8px; left: 12px; font-size: 13px; }
.week-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 4px; margin-top: 16px;
}
.day-cell {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 6px 0;
  color: var(--ink-mute);
  font-weight: 700; font-size: 13px;
}
.day-cell .glyph {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 13px;
  color: var(--ink-soft);
}
.day-cell.done .glyph { background: transparent; }
.day-cell.future .glyph { color: var(--ink-mute); }
.day-band {
  grid-column: span 5;
  background: linear-gradient(90deg, var(--accent-soft), var(--accent-soft));
  margin: 0 0;
  border-radius: var(--r-pill);
  height: 38px;
  position: relative;
}

/* ---------- decks grid ---------- */
.deck-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.deck-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
  display: flex; flex-direction: column; gap: 14px;
  cursor: pointer;
  transition: transform .12s var(--ease), box-shadow .15s var(--ease);
  text-align: left;
  min-height: 150px;
  position: relative;
  overflow: hidden;
}
.deck-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.deck-card .swatch {
  width: 40px; height: 40px;
  border-radius: 10px;
}
.deck-card .deck-name { font-weight: 600; font-size: 15.5px; line-height: 1.25; letter-spacing: -0.012em; }
.deck-card .deck-meta { color: var(--ink-mute); font-size: 13px; font-weight: 500; }

/* deck detail */
.deck-head {
  display: flex; align-items: center; gap: 14px;
}
.deck-head .swatch-lg {
  width: 40px; height: 40px; border-radius: 10px;
}
.deck-head h1 { font-size: 22px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs {
  display: flex; gap: 24px;
  border-bottom: 1px solid var(--line);
  padding: 4px 0;
}
.tab {
  padding: 10px 0;
  font-weight: 500; font-size: 14px;
  color: var(--ink-mute);
  border-bottom: 1.5px solid transparent;
  margin-bottom: -1px;
  transition: color .15s var(--ease), border-color .15s var(--ease);
  letter-spacing: -0.005em;
}
.tab.is-active { font-weight: 600; }
.tab.is-active { color: var(--ink); border-bottom-color: var(--ink); }
.tab:hover { color: var(--ink); }

.flashcard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  display: flex; flex-direction: column;
  gap: 12px;
}
.flashcard .q { font-weight: 600; font-size: 15px; letter-spacing: -0.012em; }
.flashcard .a { color: var(--ink-soft); font-size: 14px; }
.mark { color: var(--success); background: var(--success-bg); padding: 0 4px; border-radius: 5px; font-weight: 700; }

.import-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
}
.import-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  font-weight: 700; font-size: 14px;
  transition: transform .12s var(--ease), box-shadow .15s var(--ease);
  cursor: pointer;
}
.import-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.import-card.is-disabled { opacity: 0.45; cursor: default; }
.import-card.is-disabled:hover { transform: none; box-shadow: none; }

/* ---------- modal ---------- */
.scrim {
  position: fixed; inset: 0;
  background: rgba(15, 19, 34, 0.42);
  backdrop-filter: blur(2px);
  display: grid; place-items: center;
  z-index: 50;
  padding: 40px;
  animation: fadeIn .15s var(--ease);
}
.modal {
  background: var(--surface);
  border-radius: var(--r-xl);
  width: 100%;
  max-width: 760px;
  max-height: 88vh;
  box-shadow: var(--shadow-3);
  overflow: hidden;
  display: flex; flex-direction: column;
  animation: pop .2s var(--ease);
}
.modal .modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
}
.modal .modal-head .ttl { font-weight: 800; font-size: 17px; flex: 1; text-align: center; }
.modal .modal-body { padding: 22px; overflow: auto; flex: 1; }
.modal .modal-foot { padding: 16px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.close-btn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.close-btn:hover { background: var(--surface-2); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.mode-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
}
.mode-card {
  border: 1.5px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px 14px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  cursor: pointer;
  background: var(--surface);
  transition: transform .12s var(--ease), border-color .15s var(--ease), background .15s var(--ease);
}
.mode-card:hover { transform: translateY(-2px); border-color: var(--ink-mute); }
.mode-card.is-selected { border-color: var(--success); background: var(--success-bg); border-width: 2px; }
.mode-card .mode-ttl { font-weight: 600; font-size: 15px; letter-spacing: -0.012em; }
.mode-card .mode-sub { color: var(--ink-mute); font-size: 13px; text-align: center; }

/* ---------- quiz ---------- */
.quiz-shell {
  min-height: 100vh;
  background: var(--bg);
  display: flex; flex-direction: column;
}
.quiz-progress {
  height: 14px;
  background: var(--bg-2);
}
.quiz-progress .bar {
  height: 100%; background: linear-gradient(90deg, var(--accent), #A0A0FB);
  border-radius: 0 var(--r-pill) var(--r-pill) 0;
  transition: width .45s var(--ease);
}
.quiz-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px;
}
.quiz-stack {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800;
}
.quiz-stage {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 20px 24px 48px;
  gap: 16px;
}
.quiz-stage .stage-inner { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 14px; }

.question-card {
  border: 1.5px solid var(--accent);
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: 22px 24px;
  display: flex; flex-direction: column; gap: 8px;
  animation: slideUp .25s var(--ease);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.question-card .qtag {
  color: var(--success); font-weight: 600; font-size: 12.5px;
  display: inline-flex; align-items: center; gap: 6px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.question-card .qtext {
  font-weight: 600; font-size: 19px;
  letter-spacing: -0.018em;
  line-height: 1.3;
}
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 18px;
  font-weight: 500; font-size: 14.5px;
  text-align: center;
  cursor: pointer;
  transition: transform .1s var(--ease), background .15s var(--ease), border-color .15s var(--ease), opacity .25s var(--ease);
  letter-spacing: -0.005em;
}
.option:hover:not(.is-disabled):not(.is-hidden) { background: var(--surface-2); }
.option.is-correct { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.option.is-wrong { background: var(--rose-bg); border-color: var(--rose); color: var(--rose); }
.option.is-hidden { opacity: 0; pointer-events: none; transform: scale(0.97); }
.option.is-disabled { pointer-events: none; }
.helpers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 4px; }
.helper {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 10px 12px;
  font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 13.5px;
  transition: background .15s var(--ease), opacity .15s var(--ease);
  letter-spacing: -0.005em;
}
.helper:hover { background: var(--surface-2); }
.helper:disabled, .helper.is-used { opacity: 0.45; pointer-events: none; }
.helper-emoji { font-size: 18px; }

.ki-bubble {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 18px;
  display: flex; gap: 12px; align-items: flex-start;
  animation: slideUp .25s var(--ease);
}
.ki-bubble .mini-mascot {
  width: 32px; height: 32px; flex: 0 0 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--premium-a), var(--premium-b));
  display: grid; place-items: center;
}
.ki-bubble .text { flex: 1; font-size: 15.5px; line-height: 1.55; color: var(--ink-soft); }
.spinner-dots { display: inline-flex; gap: 4px; }
.spinner-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ink-mute);
  animation: pulse 1.2s var(--ease) infinite;
}
.spinner-dots span:nth-child(2) { animation-delay: 0.2s; }
.spinner-dots span:nth-child(3) { animation-delay: 0.4s; }

/* ---- KI-Tutor pro Karte (app/tutorui.js, 03.08.2026) ----
   Löst die alte einzeilige .ki-bubble im Quiz ab: strukturierte
   Erklärung (Fettungen, Stichpunkte, Merke-Zeile) plus "Mehr Details"
   und "Stelle eine Frage" — so wie im Original unter jeder Karte. */
.tutor-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 15px 17px 14px;
  display: grid; gap: 11px;
  animation: slideUp .25s var(--ease);
}
.tutor-panel.is-compact { padding: 13px 14px; }
.tutor-head { display: flex; align-items: center; gap: 9px; }
.tutor-head .mini-mascot {
  width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--premium-a), var(--premium-b));
  display: grid; place-items: center;
}
.tutor-title { font-weight: 800; font-size: 14.5px; letter-spacing: -0.01em; }
.tutor-src {
  margin-left: auto; font-size: 11px; font-weight: 700; color: var(--ink-mute);
  background: var(--surface-2); border-radius: 999px; padding: 3px 9px; white-space: nowrap;
}
.tutor-body { font-size: 15.5px; line-height: 1.55; color: var(--ink-soft); }
.tutor-md > * { margin: 0 0 8px; }
.tutor-md > *:last-child { margin-bottom: 0; }
.tutor-md b { color: var(--ink); font-weight: 800; }
.tutor-h { font-weight: 800; font-size: 15.5px; color: var(--ink); }
.tutor-list { margin: 0 0 8px; padding-left: 20px; }
.tutor-list li { margin-bottom: 5px; }
.tutor-list li::marker { color: var(--accent); }
.tutor-note {
  background: var(--accent-soft); border-radius: 12px; padding: 9px 12px;
  font-size: 14.5px; color: var(--ink);
}
.tutor-code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px;
  background: var(--surface-2); border-radius: 6px; padding: 1px 5px;
}
.tutor-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tutor-act {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13.5px; font-weight: 700;
  cursor: pointer; transition: background .15s var(--ease);
}
.tutor-act:hover { background: var(--line); }
.tutor-chat { display: grid; gap: 9px; border-top: 1px solid var(--line); padding-top: 11px; }
.tutor-q {
  justify-self: end; max-width: 82%; background: var(--ink); color: var(--surface);
  border-radius: 16px 16px 4px 16px; padding: 9px 13px; font-size: 14.5px; font-weight: 600;
}
.tutor-a { font-size: 15px; line-height: 1.55; color: var(--ink-soft); }
.tutor-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 9px; }
.tutor-chip {
  border: 1px dashed var(--line-2); background: transparent; color: var(--ink-soft);

/* ---- Konfetti-Explosion (app/celebrate.js erzeugt die Knoten, hier die Physik).
   Eigene Klassennamen (.confetti-burst-*) — .confetti-piece ist schon vom
   fallenden Rundenende-Konfetti belegt und darf nicht überschrieben werden. ---- */
.confetti-burst-layer {
  position: fixed; inset: 0; z-index: 78; pointer-events: none; overflow: hidden;
  --origin-top: 44%;
}
.confetti-bit {
  position: absolute; left: 50%; top: var(--origin-top);
  width: var(--size, 9px); height: var(--size, 9px);
  will-change: transform, opacity;
  animation: confettiBurst var(--dur, 2s) cubic-bezier(.18,.62,.3,1) var(--delay, 0s) both;
}
.confetti-bit.cf-rect { height: calc(var(--size, 9px) * 0.45); border-radius: 1.5px; }
.confetti-bit.cf-sq { border-radius: 2px; }
.confetti-bit.cf-circle { border-radius: 50%; }
.confetti-bit.cf-star {
  background: none !important; width: auto; height: auto;
  font-size: calc(var(--size, 9px) * 1.9); line-height: 1; font-weight: 900;
}
@keyframes confettiBurst {
  0%   { transform: translate(-50%, -50%) scale(.3) rotate(0deg); opacity: 0; }
  8%   { opacity: 1; }
  38%  { transform: translate(calc(-50% + var(--dx) * .82), calc(-50% + var(--dy))) scale(1) rotate(calc(var(--rot) * .45)); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 68vh)) scale(.85) rotate(var(--rot)); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .mastered-overlay::before, .mastered-card::after { animation: none; opacity: 0; }
  .mastered-trophy { animation: none; }
}

/* MC-/Lückentext-Karten (haben .options, aber keinen Füll-Spacer): mittig ausbalancieren */

.qp-skin .options { gap: 11px; margin-top: 6px; }
.qp-skin .options .option {
  position: relative; border: none; border-radius: 16px; padding: 16px 48px;
  font-weight: 700; font-size: 16px; color: #1C3A52; text-align: center; justify-content: center;
  background: #fff; box-shadow: 0 5px 14px rgba(13,47,76,.13);
  transition: transform .12s, box-shadow .12s, background .15s;
  animation: qpOptIn .32s cubic-bezier(.2,.85,.3,1.05) both;
}
.qp-skin .options .option:nth-child(2) { animation-delay: .05s; }
.qp-skin .options .option:nth-child(3) { animation-delay: .10s; }
.qp-skin .options .option:nth-child(4) { animation-delay: .15s; }
.qp-skin .options .option:nth-child(5) { animation-delay: .20s; }
@keyframes qpOptIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.qp-skin .options .option:hover:not(.is-disabled):not(.is-correct):not(.is-wrong) { transform: translateY(-2px); background: #fff; box-shadow: 0 9px 20px rgba(13,47,76,.19); }
.qp-skin .options .option:active { transform: scale(.985); }
.qp-skin .options .option.is-correct {
  background: linear-gradient(180deg, #EAFBF3, #D9F5E8); color: #157A4C;
  box-shadow: inset 0 0 0 2.5px #2EC4A0, 0 8px 20px rgba(46,196,160,.28);
}
.qp-skin .options .option.is-correct::after {
  content: '✓'; position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%; background: #2EC4A0; color: #fff;
  font-size: 15px; font-weight: 900; display: grid; place-items: center; line-height: 1;
  animation: qpBadgePop .3s cubic-bezier(.2,1.6,.4,1);
}
.qp-skin .options .option.is-wrong {
  background: linear-gradient(180deg, #FEECEF, #FBDCE2); color: #C21A3F;
  box-shadow: inset 0 0 0 2.5px #F02048, 0 8px 20px rgba(240,32,72,.2);
}
.qp-skin .options .option.is-wrong::after {
  content: '✕'; position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%; background: #F02048; color: #fff;
  font-size: 14px; font-weight: 900; display: grid; place-items: center; line-height: 1;
}
@keyframes qpBadgePop { from { transform: translateY(-50%) scale(0); } to { transform: translateY(-50%) scale(1); } }
.qp-skin .options .option.is-disabled { opacity: .5; }
.qp-skin .options .option.option-arabic { font-size: 34px; line-height: 1.85; padding: 10px 48px; }

      großem Buchstaben, Name und Prozent-Ring (siehe main.js).

/* Der Scrim hatte fix 40px Innenabstand — auf schmalen Screens ragte das

@media (max-width: 820px) { .scrim { padding: 10px; } }
.mode-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 820px) { .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }

.qcard-row { display: flex; align-items: center; gap: 14px; background: var(--surface, #fff);
  border: 1px solid var(--line, #ECEBE6); border-radius: 16px; padding: 10px 14px; }

.studio-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px;

<script>
/* ------------------------------------------------------------------
   FRISCHE-WÄCHTER (09.08.2026). Ursache des Dauerärgers "es hat sich
   nichts geändert": Der Zwischenspeicher lieferte nach einem neuen
   Hochladen weiterhin die alten Dateien aus. Jetzt fragt die App beim
   Start EINE winzige Datei ohne Zwischenspeicher ab (version.json).
   Steht dort eine andere Version als die geladene, wird der komplette
   Zwischenspeicher geleert und die Seite EINMAL neu geladen — danach
   läuft garantiert der neue Stand. Der Zähler in sessionStorage
   verhindert jede Endlosschleife.
------------------------------------------------------------------ */
(function () {
  if (location.protocol === 'file:') return;
  var tries = 0;
  try { tries = parseInt(sessionStorage.getItem('eb_reload_tries') || '0', 10) || 0; } catch (e) {}
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var live = String(j && j.build || '');
      var here = String(window.APP_BUILD || '');
      if (!live || !here || live === here) {
        try { sessionStorage.removeItem('eb_reload_tries'); } catch (e) {}
        return;
      }
      if (tries >= 2) return;               // Notbremse: lieber alt als Schleife
      try { sessionStorage.setItem('eb_reload_tries', String(tries + 1)); } catch (e) {}
      var done = function () { location.reload(); };
      var jobs = [];
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      Promise.all(jobs).then(done, done);
    })
    .catch(function () { /* offline: alter Stand ist völlig in Ordnung */ });
})();

// PWA: Service Worker registrieren (macht die App installierbar & offline-fähig).
// Läuft nur über https bzw. localhost — beim direkten Öffnen der Datei passiert nichts.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline/Datei-Modus: egal */ });
  });
}
// Install-Aufforderung des Browsers einfangen — Settings/Home können sie über
// window.PWAInstall.prompt() gezielt auslösen ("📲 Als App installieren").
window.PWAInstall = { deferred: null, prompt: function () { if (this.deferred) { this.deferred.prompt(); this.deferred = null; return true; } return false; } };
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.PWAInstall.deferred = e; });

/* Knopf "App aktualisieren" (Einstellungen / Verbindung prüfen). */
window.forceAppUpdate = function () {
  var jobs = [];
  if (window.caches && caches.keys) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
  }
  try { sessionStorage.removeItem('eb_reload_tries'); } catch (e) {}
  var go = function () { location.replace(location.pathname + '?u=' + Date.now()); };
  Promise.all(jobs).then(go, go);
};
</script>
