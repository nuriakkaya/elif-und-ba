  .qp-skin .qp-cardbody .qtext-arabic { font-size: clamp(36px, 10vw, 50px); line-height: 1.55; }
  .qp-skin .quiz-stage .stage-inner { gap: 9px; }
  .qp-skin .options { gap: 8px; }
  .qp-skin .options .option { min-height: 42px; padding: 9px 40px; font-size: 14.5px; }
  .qp-skin .options .option.option-arabic { font-size: 25px; line-height: 1.4; padding: 5px 40px; min-height: 46px; }
  .qp-skin .qp-btn { padding: 11px 14px; font-size: 13.5px; border-radius: 13px; }
  .qp-skin .qp-gatespacer { flex: 1 1 6px; min-height: 2px; }
  .qp-skin .qp-cardlabel { padding: 8px 12px; font-size: 12.5px; }
  .qp-skin .qp-hintbox { padding: 8px 10px; font-size: 12.5px; }
  .qp-skin .qp-answrap .qp-ansfield { padding: 10px 12px; }
  .qp-skin .qp-formpanel .qp-formar { font-size: 30px; }
  .qp-skin .qp-tile { font-size: 28px; padding: 6px 10px; }
  .qp-skin .spkrow { gap: 8px; }
}
@media (max-height: 645px) {
  .qp-skin .qp-cardbody, .qp-skin .stage-inner:has(.options) .qp-cardbody { min-height: clamp(88px, 17dvh, 150px); padding: 8px 12px; }
  .qp-skin .qp-cardbody .qtext-arabic { font-size: clamp(30px, 8.5vw, 40px); line-height: 1.45; }
  .qp-skin .qp-cardbody .qtext-arabic.ist-satz { font-size: clamp(22px, 6vw, 28px); line-height: 1.8; }
  .qp-skin .options { gap: 6px; }
  .qp-skin .options .option { min-height: 38px; padding: 7px 36px; font-size: 13.5px; }
  .qp-skin .options .option.option-arabic { font-size: 21px; line-height: 1.35; padding: 4px 36px; min-height: 40px; }
  .qp-skin .quiz-stage .stage-inner { gap: 7px; }
  .qp-skin .qp-btn { padding: 9px 12px; font-size: 12.5px; }
}


/* ==================================================================
   DREI NEUE FRAGETYPEN (13.08.2026): 🎤 Lese-Check, 🔗 Paare verbinden,
   🧱 Wort-Baukasten — im Stil der bestehenden Lernkarten.
   ================================================================== */
/* --- Lese-Check --- */
.qp-mic { display: grid; place-items: center; width: 92px; height: 92px; margin: 6px auto 0; border: none; border-radius: 50%;
  background: linear-gradient(135deg, #1c5b8f, var(--brand)); color: #fff; font-size: 40px; cursor: pointer;
  box-shadow: 0 10px 22px rgba(46,36,112,.35); transition: transform .12s; }
.qp-mic:active { transform: scale(.94); }
.qp-mic.is-live { animation: micPulse 1.1s ease-in-out infinite; background: linear-gradient(135deg, #B3123A, #7c0c28); }
@keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(179,18,58,.45); } 50% { box-shadow: 0 0 0 16px rgba(179,18,58,0); } }
.qp-micnote { text-align: center; font-weight: 700; font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
.qp-rcheard { background: #fff; border-radius: 12px; padding: 9px 12px; text-align: center; font-size: 13.5px; font-weight: 600;
  color: var(--ink-soft); box-shadow: 0 4px 12px rgba(46,36,112,.10); }
.qp-rcheard.is-ok { color: var(--success, var(--success-3)); font-size: 15px; }
/* --- Paare verbinden --- */
.qp-pairwrap { display: flex; gap: 10px; }
.qp-paircol { flex: 1 1 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.qp-pair { border: 2.5px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 8px; font: inherit; font-weight: 800;
  font-size: 15.5px; color: var(--brand); cursor: pointer; box-shadow: 0 4px 10px rgba(46,36,112,.10); transition: transform .1s, border-color .12s;
  }
.qp-pair:active { transform: scale(.97); }
.qp-pair-ar { font-family: 'Scheherazade New', 'Noto Naskh Arabic', serif; font-size: 27px; line-height: 1.8; padding: 4px 8px; } /* 1.8: Şedde und Dolch-Elif wurden oben abgeschnitten (23.09.2026) */
.qp-pair.is-sel { border-color: var(--brand); background: var(--accent-soft); }
.qp-pair.is-done { border-color: var(--success, var(--success-3)); background: var(--success-bg); color: var(--success, var(--success-3)); pointer-events: none; }
.qp-pair.is-bad { border-color: #D64545; background: #FBE9E9; animation: pairShake .35s; }
@keyframes pairShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.qp-skin .stage-inner:has(.qp-pairwrap) .qp-cardbody { min-height: 0; padding: 12px 14px; }
.qp-skin .stage-inner:has(.qp-pairwrap) .qtext { font-size: 16.5px; font-weight: 800; }
/* --- Wort-Baukasten --- */
.qp-buildslots { display: flex; flex-direction: row; justify-content: center; gap: 8px; background: rgba(255,255,255,.6);
  border: 2.5px dashed var(--line-2); border-radius: 14px; padding: 10px; min-height: 66px; align-items: center; }
.qp-slot { display: inline-grid; place-items: center; min-width: 46px; height: 52px; border-radius: 10px; background: #fff;
  border: 2px solid var(--line); color: var(--brand); font-family: 'Scheherazade New', 'Noto Naskh Arabic', serif; font-size: 30px; font-weight: 700; padding: 0 6px; }
.qp-slot.is-filled { background: var(--success-bg); border-color: var(--success, var(--success-3)); animation: slotIn .22s ease-out; }
@keyframes slotIn { from { transform: scale(.7); } to { transform: scale(1); } }
.qp-buildtiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.qp-btile { border: none; background: #fff; border-radius: 12px; padding: 2px 14px; font-family: 'Scheherazade New', 'Noto Naskh Arabic', serif;
  font-size: 32px; font-weight: 700; color: var(--brand); cursor: pointer; box-shadow: 0 5px 12px rgba(46,36,112,.15); transition: transform .1s, opacity .15s; }
.qp-btile:active { transform: scale(.95); }

/* --- Talim-Reihen groesser (10.09.2026) ------------------------------------
   Bei den Reihen unterscheiden sich Kachel und Falle nur durch EIN winziges
   Zeichen: „اُتْ" (üt, mit Cezim) gegen „اُتَ" (üte, ohne). Nachgemessen, wie
   viele Bildpunkte diesen Unterschied ausmachen:

       23 px Schrift  ->  31 Punkte     (ein Fleck von etwa 5 x 6)
       27 px          ->  41
       32 px          ->  50
       38 px          ->  79

   Der ANTEIL an der Tinte bleibt fast gleich (15–19 %), die absolute Flaeche
   aber nicht — und die entscheidet, ob ein Kind am Tablet den Unterschied
   ueberhaupt sieht. Deshalb sind Reihen-Kacheln groesser als Wort-Kacheln.
   Sie sind auch kuerzer (drei Zeichen statt sechs), es ist also Platz da. */
.qp-btile.ist-reihe { font-size: 42px; padding: 4px 16px; }
.qp-slot.ist-reihe { font-size: 38px; min-width: 58px; height: 62px; }
.qp-btile.is-used { opacity: .28; pointer-events: none; }
.qp-btile.is-wob { animation: pairShake .4s; background: #FBE9E9; }
.qp-skin .stage-inner:has(.qp-buildslots) .qp-cardbody { min-height: 0; padding: 14px; }
.qp-skin .stage-inner:has(.qp-buildslots) .qtext { font-size: 20px; font-weight: 800; letter-spacing: .04em; }
/* --- Kompakt auf kurzen Displays --- */
@media (max-height: 760px) {
  .qp-mic { width: 76px; height: 76px; font-size: 33px; }
  .qp-pair { padding: 8px 7px; font-size: 14px; }
  .qp-pair-ar { font-size: 23px; padding: 3px 7px; }
  .qp-slot { min-width: 40px; height: 46px; font-size: 26px; }
  .qp-btile { font-size: 27px; padding: 2px 11px; }
  .qp-btile.ist-reihe { font-size: 34px; padding: 3px 13px; }
  .qp-slot.ist-reihe { font-size: 31px; min-width: 48px; height: 54px; }
  .qp-buildslots { min-height: 56px; padding: 7px; gap: 6px; }
}
@media (max-height: 645px) {
  .qp-mic { width: 64px; height: 64px; font-size: 28px; }
  .qp-pair { padding: 6px 6px; font-size: 13px; }
  .qp-pair-ar { font-size: 20px; }
  .qp-slot { min-width: 34px; height: 40px; font-size: 22px; }
  .qp-btile { font-size: 23px; padding: 1px 9px; }
}

  margin-top: 10px; background: rgba(255,255,255,.5); }

/* ============================================================================
   ANSTRICH 10.0 — „richtig wie eine App"
   Diese Ebene steht bewusst ganz am Ende: Sie überschreibt die alten
   marineblauen Festwerte, macht die Knöpfe anfassbar (sie sinken beim
   Drücken ein), rundet alles freundlicher ab und bringt Bewegung rein.
   ========================================================================== */

/* ---------- 1. Knöpfe mit Tiefe -------------------------------------------
   Kinder drücken gern etwas, das nachgibt. Jeder Knopf hat unten eine
   dunklere Kante; beim Antippen rutscht er darauf herunter. */
.btn {
  border-radius: var(--r-md);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -.005em;
  padding: 12px 18px;
  transition: transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s;
}
.btn-primary, .btn-accent, .btn-success {
  border: none;
  box-shadow: 0 4px 0 var(--brand-3);
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-2); }
.btn-accent { background: var(--brand); color: #fff; }
.btn-success { background: var(--success); box-shadow: 0 4px 0 var(--success-3); }
.btn-primary:active, .btn-accent:active, .btn-success:active {
  transform: translateY(4px); box-shadow: 0 0 0 var(--brand-3);
}
.btn-ghost { box-shadow: 0 3px 0 var(--line-2); border-color: var(--line); }
.btn-ghost:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line-2); }
.btn-lg { padding: 15px 22px; font-size: 16.5px; border-radius: var(--r-lg); }

/* Die großen Knöpfe im Lernbildschirm: keine Versalien mehr — die schreien,
   und Kinder lesen gemischte Schrift schneller. */
.qp-btn, .qp-rate {
  text-transform: none;
  letter-spacing: -.01em;
  font-size: 16.5px;
  font-weight: 900;
  border-radius: var(--r-md);
  padding: 15px 18px;
  transition: transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s;
}
.qp-btn { background: var(--brand); box-shadow: 0 4px 0 var(--brand-3); }
.qp-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--brand-3); }
.qp-btn:disabled { filter: grayscale(.55) opacity(.55); box-shadow: 0 4px 0 var(--line-2); }
.qp-btn-red { background: var(--rose); box-shadow: 0 4px 0 var(--rose-3); }
.qp-btn-red:active { box-shadow: 0 0 0 var(--rose-3); }
.qp-rate { padding: 14px 8px; }
.qp-rate-ja { background: var(--success); box-shadow: 0 4px 0 var(--success-3); }
.qp-rate-vage { background: var(--gold); color: #4A3208; box-shadow: 0 4px 0 var(--gold-3); }
.qp-rate-nein { background: var(--rose); box-shadow: 0 4px 0 var(--rose-3); }
.qp-rate:active { transform: translateY(4px) !important; box-shadow: none !important; }

/* ---------- 2. Antwortmöglichkeiten ---------------------------------------- */
.option {
  border-width: 2px;
  border-bottom-width: 5px;
  border-radius: var(--r-md);
  font-weight: 800;
  transition: transform .12s var(--ease), border-color .15s, background .15s;
}
.option:active:not(.is-disabled) { transform: translateY(3px); border-bottom-width: 2px; }
.option.is-correct { border-bottom-width: 5px; }
.option.option-arabic { font-size: 34px; }

/* ---------- 3. Lernkarte: Smaragd statt Marineblau ------------------------- */
.qp-cardlabel { background: var(--brand); border-radius: var(--r-lg) var(--r-lg) 0 0; font-size: 14px; padding: 10px 16px; }
.qp-cardlabel-slim { border-radius: var(--r-lg) var(--r-lg) 0 0; }
.qp-cardbody {
  background: var(--surface); border: 2.5px solid var(--brand); border-top: none;
  border-radius: 0 0 var(--r-lg) var(--r-lg); box-shadow: var(--shadow-2);
}
.qp-ansfield { background: var(--surface); border: 2.5px solid var(--brand); border-top: none;
  border-radius: 0 0 var(--r-lg) var(--r-lg); color: var(--ink); }
.qp-hintbox { background: var(--surface); color: var(--ink-soft); border-radius: var(--r-sm); box-shadow: var(--shadow-1); }
.qp-skin { background: linear-gradient(178deg, var(--bg-2) 0%, var(--bg) 42%) !important; }
.quiz-shell.qp-skin { background: linear-gradient(178deg, var(--brand-soft-2) 0%, var(--bg) 46%) !important; }
.qp-skin .quiz-topbar { background: var(--brand); }
.qp-skin .quiz-progress { background: rgba(255,255,255,.30); }
.qp-skin .quiz-progress .bar { background: linear-gradient(90deg, var(--gold-2), var(--gold)); }

/* ---------- 4. Fortschritt mit Glanzkante --------------------------------- */
.quiz-progress { border-radius: var(--r-pill); overflow: hidden; height: 10px; }
.quiz-progress .bar {
  border-radius: var(--r-pill); position: relative;
  background: linear-gradient(90deg, var(--brand-2), var(--brand));
  transition: width .7s var(--ease);
}
.quiz-progress .bar::after {
  content: ''; position: absolute; left: 5px; right: 5px; top: 2px; height: 2.5px;
  border-radius: 3px; background: rgba(255,255,255,.4);
}

/* ---------- 5. Stapelkacheln ---------------------------------------------- */
.deck-card {
  border-radius: var(--r-lg);
  transition: transform .16s var(--ease), box-shadow .16s var(--ease);
}
.deck-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-3); }
.deck-card:active { transform: translateY(0) scale(.985); }
.deck-card .swatch { border-radius: var(--r-sm); }
.deck-card .deck-name { font-weight: 800; }

/* ---------- 6. Untere Leiste am Handy ------------------------------------- */
@media (max-width: 860px) {
  .mn-item { border-radius: var(--r-md); transition: color .18s, background .18s; position: relative; }
  .mn-item .nav-icon, .mn-item svg { transition: transform .24s var(--e-pop); }
  .mn-item.is-active { background: transparent; color: var(--brand); }
  .mn-item.is-active .nav-icon, .mn-item.is-active svg { transform: translateY(-2px) scale(1.14); }
  .mn-item.is-active::after {
    content: ''; position: absolute; top: 2px; left: 50%; margin-left: -13px;
    width: 26px; height: 3.5px; border-radius: 3px; background: var(--brand);
  }
}

/* ---------- 7. Auswendig-Bereich: Farbe angleichen ------------------------- */
.hz-tour-dots span.is-now { background: var(--brand); }
.hz-tour-dots span.is-done { background: var(--brand-soft-2); }
.hz-tour-dots span { background: var(--line); }
.hz-tour { border-radius: var(--r-xl); box-shadow: var(--shadow-3); }
.hz-perle.is-done, .hz-perle.is-ok { box-shadow: var(--sh-brand); }

/* ---------- 8. Bewegung ---------------------------------------------------
   Alles tritt kurz von unten auf — das ist der Unterschied zwischen
   „Webseite springt um" und „App gleitet". */
@keyframes ebRise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes ebPop  { 0% { transform: scale(.72); opacity: 0; } 60% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
.deck-card, .feed-card, .stat-card { animation: ebRise .38s var(--ease) both; }
.deck-card:nth-child(2){animation-delay:.03s} .deck-card:nth-child(3){animation-delay:.06s}
.deck-card:nth-child(4){animation-delay:.09s} .deck-card:nth-child(5){animation-delay:.12s}
.deck-card:nth-child(6){animation-delay:.15s} .deck-card:nth-child(7){animation-delay:.18s}
.deck-card:nth-child(n+8){animation-delay:.21s}
.qp-cardbody { animation: ebRise .3s var(--ease) both; }

/* Weniger Bewegung, wenn das Gerät danach fragt */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- 9. Sichtbarer Tastatur-Fokus (Barrierefreiheit) ---------------- */
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }

/* ---------- 10. Kleine Handys: nichts wichtiges unter den Rand ------------- */
@supports (padding: max(0px)) {
  .mobile-nav, .mn-bar { padding-bottom: max(6px, env(safe-area-inset-bottom)); }
}

/* ============================================================================

.pfad-knopf.ist-fertig { background: var(--gold); box-shadow: 0 6px 0 var(--gold-3); }
.pfad-knopf.ist-fertig .pk-zeichen { font-size: 28px; }
.pfad-knopf.ist-zu { background: var(--bg-2); color: var(--ink-mute); box-shadow: 0 6px 0 var(--line-2); cursor: not-allowed; }
.pfad-knopf.ist-zu .pk-zeichen { font-size: 21px; opacity: .75; }
.pk-ring { position: absolute; inset: -3px; transform: rotate(-90deg); pointer-events: none; }
.pk-ring circle { stroke: var(--gold-2); }
.pfad-knopf.ist-jetzt { animation: pfadWippe 2.6s ease-in-out infinite; }
@keyframes pfadWippe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.pfad-halt:has(.ist-jetzt)::before {
  content: ''; position: absolute; left: 50%; top: 33px; width: 96px; height: 96px;
  margin: -48px 0 0 -48px; border-radius: 50%; border: 4px solid var(--brand);
  opacity: .3; animation: pfadPuls 2.2s var(--ease) infinite; pointer-events: none;
}
@keyframes pfadPuls { 0% { transform: scale(.75); opacity: .45; } 70% { transform: scale(1.05); opacity: 0; } 100% { opacity: 0; } }
.pfad-start {
  position: absolute; left: 50%; top: -30px; transform: translateX(-50%); white-space: nowrap;
  background: var(--surface); border: 1px solid var(--line); color: var(--brand);
  font-size: 11.5px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
  padding: 5px 12px; border-radius: var(--r-pill); box-shadow: var(--shadow-2); z-index: 2;
}
.pfad-start::after { content: ''; position: absolute; bottom: -5px; left: 50%; margin-left: -5px;
  width: 9px; height: 9px; background: var(--surface); border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.pfad-name { display: block; margin-top: 8px; font-size: 12.5px; font-weight: 800; color: var(--ink-soft);
  line-height: 1.25; }
.pfad-name.ist-blass { color: var(--ink-mute); font-weight: 700; }
.pfad-ziel { display: flex; align-items: center; gap: 13px; margin: 22px 0 4px; padding: 15px 16px;
  background: var(--gold-soft); border: 1px dashed var(--gold); border-radius: var(--r-lg); }
.pz-krone { font-size: 30px; line-height: 1; }
.pfad-ziel b { font-size: 15px; }

/* Auf breiten Bildschirmen bleibt der Weg mittig und schmal */
@media (min-width: 861px) { .pfad { max-width: 420px; margin: 0 auto; } }

/* Werkzeugreihe über dem Lernpfad: ein Streifen zum Wischen statt Turm */
.werkzeuge { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.werkzeuge::-webkit-scrollbar { display: none; }
.werkzeuge > * { flex: 0 0 auto; white-space: nowrap; }
.werkzeuge .btn { font-size: 14px; padding: 10px 14px; }
/* Überschriften der Abschnitte dürfen nicht mehr zerreißen */
.section-head .title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 17px; font-weight: 900; letter-spacing: -.02em; }
.section-head .title .muted { flex-basis: 100%; }

/* Feinschliff Lernpfad: kleinere Halte, lesbare Namen, weniger Scrollweg */
.pfad-halt { width: 132px; }
.pfad-knopf { width: 62px; height: 58px; border-radius: 31px / 29px; box-shadow: 0 5px 0 var(--brand-3); }
.pfad-knopf.ist-fertig { box-shadow: 0 5px 0 var(--gold-3); }
.pfad-knopf.ist-zu { box-shadow: 0 5px 0 var(--line-2); }
.pk-zeichen { font-size: 21px; }
.pfad-knopf.ist-fertig .pk-zeichen { font-size: 25px; }
.pk-schloss { position: absolute; right: -3px; bottom: -3px; font-size: 14px;
  background: var(--surface); border-radius: 50%; width: 22px; height: 22px;
  display: grid; place-items: center; box-shadow: var(--shadow-1); }
.pfad-luecke { padding: 5px 0; gap: 5px; }
.pfad-luecke i { width: 6px; height: 6px; }
.pfad-name { font-size: 12px; margin-top: 7px; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.pfad-halt:has(.ist-jetzt)::before { top: 29px; width: 86px; height: 86px; margin: -43px 0 0 -43px; }
.pfad-start { top: -26px; }
/* Kopfzeile schlanker: der Weg soll oben stehen, nicht der Verwaltungskram */
@media (max-width: 860px) {
  .page.wide > .row:first-child h1 { font-size: 22px; }
  .page.wide > .row:first-child .btn-primary { font-size: 0; padding: 11px 13px; gap: 0; }
  .page.wide > .row:first-child .btn-primary svg { width: 20px; height: 20px; }
}

/* ============================================================================
   LERNBILDSCHIRM 10.0 — der Ort, an dem die Kinder 90 % ihrer Zeit sind.
   Der alte Himmelblau-Verlauf wich einem warmen Papierton mit einem Hauch
   Smaragd; die Antwortkacheln haben jetzt dieselbe anfassbare Kante wie
   alle anderen Knöpfe.
   ========================================================================== */
.quiz-shell.qp-skin {
  background: linear-gradient(178deg, var(--brand-soft-2) 0%, var(--bg) 38%, var(--bg) 100%) !important;
}
.quiz-shell.qp-skin::before { opacity: .5; }
.qp-skin .quiz-topbar { background: var(--brand); border-radius: 0 0 22px 22px;
  box-shadow: 0 8px 24px rgba(106,90,224,.28); }
.qp-skin .quiz-progress { background: rgba(255,255,255,.28); }
.qp-skin .quiz-progress .bar { background: linear-gradient(90deg, var(--gold), var(--gold-2));
  box-shadow: 0 0 10px rgba(240,184,78,.55); }
.qp-skin .qp-cardlabel { background: linear-gradient(135deg, var(--brand-2), var(--brand-3)) !important;
  border-radius: var(--r-xl) var(--r-xl) 0 0; }
.qp-skin .qp-card { filter: drop-shadow(0 14px 28px rgba(46,36,112,.16)); }
.qp-skin .qp-cardbody { border-color: var(--brand-3); border-radius: 0 0 var(--r-xl) var(--r-xl);
  min-height: clamp(140px, 26dvh, 280px); }
.qp-skin .qp-ansfield { border-color: var(--brand-3); border-radius: 0 0 var(--r-xl) var(--r-xl); }
.qp-skin .muted { color: var(--ink-soft); }

/* Antwortkacheln: weiß, aber mit fühlbarer Unterkante */
.qp-skin .options .option {
  color: var(--ink); background: var(--surface); font-weight: 800; font-size: 16.5px;
  padding: 15px 20px; border-radius: var(--r-lg);
  box-shadow: 0 5px 0 var(--line-2), 0 6px 14px rgba(46,36,112,.07);
}
.qp-skin .options .option:hover:not(.is-disabled):not(.is-correct):not(.is-wrong) {
  transform: none; box-shadow: 0 5px 0 var(--line-2), 0 10px 20px rgba(46,36,112,.11); }
.qp-skin .options .option:active:not(.is-disabled) {
  transform: translateY(4px); box-shadow: 0 1px 0 var(--line-2); }
.qp-skin .options .option.is-correct {
  background: linear-gradient(180deg, var(--success-bg), var(--success-bg)); color: var(--success-3);
  box-shadow: inset 0 0 0 2.5px var(--success), 0 6px 18px rgba(46,158,107,.26); }
.qp-skin .options .option.is-wrong {
  background: var(--rose-bg); color: var(--rose-3);
  box-shadow: inset 0 0 0 2.5px var(--rose), 0 6px 18px rgba(194,76,60,.22); }
.qp-skin .script-row .option.is-correct { background: var(--success-bg); border-color: var(--success); }
.qp-skin .script-row .option.is-wrong { background: var(--rose-bg); border-color: var(--rose); }

/* Hör-Knöpfe */
.qp-skin .spk-btn { background: var(--brand); box-shadow: 0 4px 0 var(--brand-3); border-radius: var(--r-md); }
.qp-skin .spk-btn:active { transform: translateY(4px); box-shadow: none; }
.qp-skin .spk-btn.is-sel { background: var(--brand-2); }
.qp-skin .spk-btn.is-ok { background: var(--success); box-shadow: 0 4px 0 var(--success-3); }
.qp-skin .spk-btn.is-bad { background: var(--rose); box-shadow: 0 4px 0 var(--rose-3); }
.qp-skin .bigspk { background: var(--brand); border-radius: var(--r-lg); box-shadow: 0 5px 0 var(--brand-3); }
.qp-skin .bigspk:active { transform: translateY(5px); box-shadow: none; }

/* ============================================================================
   DUNKELMODUS — Feinschliff
   Im Dunkeln ist Smaragd hell (Mint). Weiße Schrift auf Mint wäre zu blass,
   deshalb steht dort dunkle Schrift; und die Tagesziel-Karte wird zur tiefen
   Fläche mit Mint-Akzenten statt zum grellen Farbblock.
   ========================================================================== */
.theme-dark .btn-primary, .theme-dark .btn-accent, .theme-dark .btn-success,
.theme-dark .qp-btn, .theme-dark .qp-rate-ja, .theme-dark .qp-rate-nein,
.theme-dark .pfad-knopf, .theme-dark .pfad-knopf.ist-fertig,
.theme-dark .w-tag.ist-an .w-pk, .theme-dark .w-tag.ist-gold .w-pk { color: #06211B; }
.theme-dark .qp-btn-red { color: #2A0C07; }

.theme-dark .ziel-karte {
  background: linear-gradient(152deg, #15352D, #102A24 58%, #0D231E);
  border: 1px solid var(--line-2); box-shadow: var(--shadow-2); color: var(--ink);
}
.theme-dark .ziel-karte::before { opacity: .07; }
.theme-dark .ziel-titel { color: var(--brand-2); }
.theme-dark .ziel-sub { color: var(--ink-soft); }
.theme-dark .ziel-pill { background: rgba(255,255,255,.07); color: var(--ink); }
.theme-dark .zr-trk { stroke: rgba(255,255,255,.10); }
.theme-dark .ziel-mitte b { color: var(--ink); }

.theme-dark .qp-skin .options .option { background: var(--surface-2); color: var(--ink);
  box-shadow: 0 5px 0 var(--line-2), 0 6px 16px rgba(0,0,0,.4); }
.theme-dark .qp-cardbody, .theme-dark .qp-ansfield { background: var(--surface); color: var(--ink); }
.theme-dark .quiz-shell.qp-skin { background: linear-gradient(178deg, #12302A 0%, var(--bg) 40%) !important; }
.theme-dark .quiz-shell.qp-skin::before { opacity: .18; }
.theme-dark .pfad-ziel { background: rgba(240,184,78,.09); }
.theme-dark .weiter-knopf { box-shadow: 0 4px 0 var(--line-2); }

/* Kopfzeile im Lernbildschirm dunkel halten (weiß auf Mint wäre zu blass) */
.theme-dark .qp-skin .quiz-topbar { background: var(--surface-2); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.theme-dark .qp-skin .qp-cardlabel { background: linear-gradient(135deg, #1B4F44, #143C34) !important; color: var(--ink); }
.theme-dark .replay-note { background: var(--gold-soft); color: var(--gold-2); }
.theme-dark .replay-note.is-none { background: var(--surface-2); color: var(--ink-mute); }
.replay-note { background: var(--gold-soft); color: var(--gold-3); }
.replay-note.is-none { background: var(--bg-2); color: var(--ink-mute); }

/* ---------- Rundenabschluss: der Moment, auf den die Kinder warten -------- */
.roundend-title { font-family: var(--f-ui, inherit); font-family: inherit; font-weight: 900;
  font-size: 30px; letter-spacing: -.03em; }
.roundend-title-accent { color: var(--brand); transform: rotate(-1.5deg); }
.re-vogel { display: grid; place-items: center; margin-bottom: -4px;
  animation: reHuepf .7s var(--e-pop) both; }
@keyframes reHuepf { 0% { transform: scale(.5) translateY(24px); opacity: 0; }
  60% { transform: scale(1.08) translateY(-6px); } 100% { transform: none; opacity: 1; } }
.re-xp { display: flex; align-items: baseline; justify-content: center; gap: 7px; margin: -2px 0 2px; }
.re-xp b { font-size: 46px; font-weight: 900; letter-spacing: -.045em; color: var(--gold-3);
  line-height: 1; font-variant-numeric: tabular-nums; }
.theme-dark .re-xp b { color: var(--gold-2); }
.re-xp span { font-size: 17px; font-weight: 900; color: var(--gold-3); }
.theme-dark .re-xp span { color: var(--gold-2); }
.re-pill-feuer { background: var(--gold-soft); color: var(--gold-3); font-weight: 800; border: none; }
.re-pill-ziel { background: var(--brand-soft, #E4F1EC); color: var(--brand); font-weight: 800; border: none; }
.re-pill-ziel-ok { background: var(--success-bg); color: var(--success); font-weight: 800; border: none; }
.roundend .card { border-radius: var(--r-xl); box-shadow: var(--shadow-2); }
.roundend-foot { border-top: 1px solid var(--line); background: var(--surface); }
.confetti-piece { border-radius: 2px; }

/* ---------- Fortschritt: Stufen-Wappen und Überschriften ------------------ */
.level-shield {
  background: linear-gradient(150deg, var(--brand-2), var(--brand) 60%, var(--brand-3)) !important;
  color: #fff !important; border: none !important;
  box-shadow: var(--sh-brand); border-radius: var(--r-lg);
  font-weight: 900; letter-spacing: -.03em;
}
.theme-dark .level-shield { color: #06211B !important; }
.xp-bar .fill { background: linear-gradient(90deg, var(--brand-2), var(--brand)); }
.xp-pill { background: var(--success-bg); color: var(--success-3); font-weight: 800; }
.theme-dark .xp-pill { color: var(--success); }
/* „Fraunces" ist nicht im Paket — die Überschriften nehmen unsere Hausschrift */
.level-card [style*="Fraunces"], .roundend-title { font-family: inherit !important; }

/* Karten-Kopfzeilen brechen sauber um, statt Wörter zu zerreißen */
.kartenkopf { display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.kartenkopf h2 { margin: 0; font-size: 19px; letter-spacing: -.025em; white-space: nowrap; }
.kartenkopf .pill { flex: 0 1 auto; }
@media (max-width: 430px) { .kartenkopf .pill { font-size: 12px; } }

/* ============================================================================
   KLEINE HANDYS (320 × 568 und ähnlich)
   Ziel: Der Knopf „Weiterlernen" muss ohne Scrollen erreichbar sein — das war
   schon in Version 8.7 die Hauptkritik und gilt für die neue Startseite genauso.
   ========================================================================== */
@media (max-width: 380px), (max-height: 660px) {
  .heute-kopf { padding-bottom: 6px; }
  .heute-gruss { font-size: 17.5px; }
  .heute-stufe { font-size: 12.5px; }

  .ziel-karte { padding: 12px 13px; gap: 12px; border-radius: var(--r-lg); }
  .ziel-ring { width: 68px; height: 68px; flex: 0 0 68px; }
  .ziel-mitte b { font-size: 20px; }
  .ziel-mitte span { font-size: 9.5px; }
  .ziel-titel { font-size: 15px; }
  .ziel-sub { font-size: 12.5px; line-height: 1.35; }
  /* (23.09.2026) Bei 360 px passen „🔥 0 Tage · ✨ 68 XP heute · ⏱ 0 / 30 Min" nicht in
     eine Zeile — die dritte Pille war abgeschnitten. Umbrechen statt kürzen. */
  .ziel-reihe { gap: 5px; margin-top: 7px; flex-wrap: wrap; }
  .ziel-pill { font-size: 11px; padding: 4px 8px; white-space: nowrap; }

  .woche { margin: 9px 0 10px; gap: 3px; }
  .w-pk { max-width: 30px; font-size: 12px; }
  .w-nm { font-size: 9.5px; }

  .weiter-knopf { padding: 12px 13px; gap: 10px; }
  .wk-ico { font-size: 22px; }
  .wk-txt b { font-size: 15px; }
  .wk-txt span { font-size: 12.5px; }

  .mn-item { font-size: 9px !important; line-height: 1.05; letter-spacing: -.01em; padding: 5px 0; }
  .page { padding-left: 14px; padding-right: 14px; }

  .pfad-knopf { width: 56px; height: 52px; border-radius: 28px / 26px; }
  .pk-zeichen { font-size: 19px; }
  .pfad-name { font-size: 11.5px; }
  .pfad-halt { width: 118px; }
}

/* ---------- Formularelemente in der Hausfarbe ----------------------------- */
input[type="checkbox"], input[type="radio"], input[type="range"], progress {
  accent-color: var(--brand);
}
input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; cursor: pointer; }
input[type="text"], input[type="password"], input[type="number"], input[type="search"], input:not([type]),
input[type="email"], textarea, select {
  font-family: inherit; font-size: 16px; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line-2); border-radius: var(--r-md);
  padding: 12px 14px; transition: border-color .15s, box-shadow .15s;
}
input:focus, textarea:focus, select:focus {
  outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--accent-soft);
}
input::placeholder, textarea::placeholder { color: var(--ink-mute); }

/* Code eingeben und beitreten — passt jetzt auch auf schmale Handys */
.code-reihe { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.code-feld { flex: 1 1 140px; min-width: 0; text-align: center;
  font-size: 20px; font-weight: 900; letter-spacing: 4px; }
.code-reihe .btn { flex: 0 0 auto; }
@media (max-width: 400px) { .code-reihe .btn { flex: 1 1 100%; } }

/* ---------- Startseite: die Themenkarten kompakter ------------------------
   Sie bleiben inhaltlich, wie sie sind — nur enger gesetzt, damit unter dem
   Tagesziel nicht vier fast bildschirmhohe Blöcke stehen. */
.home-hero .card { padding: 14px !important; margin-top: 10px !important; border-radius: var(--r-lg); }
.home-hero .card .muted { font-size: 13px; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.home-hero .card .btn { padding: 10px 15px; font-size: 14.5px; }
.home-hero .card > .row { gap: 10px !important; }
.home-hero .card > .row > div:first-child { font-size: 26px !important; }

/* Im Dunkeln müssen auch die gesperrten Wegpunkte lesbar bleiben */
.theme-dark .pfad-knopf.ist-zu { background: var(--surface-2); color: var(--ink-soft);
  box-shadow: 0 5px 0 var(--line-2); }
.theme-dark .pfad-knopf.ist-zu .pk-zeichen { opacity: 1; }
.theme-dark .pk-schloss { background: var(--surface-2); }
.theme-dark .pfad-luecke i { background: var(--line-2); }

/* ---------- Profilkopf: bricht sauber um statt zu zerquetschen ------------ */
.profilkopf { display: grid; grid-template-columns: auto 1fr auto; align-items: center;
  gap: 14px; padding: 18px !important; }
.profilkopf .pk-mitte { min-width: 0; }
.profilkopf .pk-mitte h1 { line-height: 1.15; }
.profilkopf .pk-mitte .muted { font-size: 13px; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.profilkopf .btn { white-space: nowrap; }
.pk-zahnrad { padding: 10px 12px !important; font-size: 18px; }
@media (max-width: 520px) {
  .profilkopf { grid-template-columns: auto 1fr auto; grid-template-areas: "bild mitte zahn" "knopf knopf knopf"; }
  .profilkopf > :nth-child(1) { grid-area: bild; }
  .profilkopf .pk-mitte { grid-area: mitte; }
  .profilkopf > .btn:not(.pk-zahnrad) { grid-area: knopf; width: 100%; }
  .profilkopf .pk-zahnrad { grid-area: zahn; }
}

/* ---------- Bildschirmwechsel: gleiten statt springen --------------------- */
.bildwechsel { animation: bildAuf .3s var(--ease) both; }
@keyframes bildAuf { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- „Das wackelt noch" -------------------------------------------- */
.wackel-zeile { display: flex; align-items: center; gap: 10px; padding: 9px 0;
  border-bottom: 1px solid var(--line); }
.wackel-zeile:last-of-type { border-bottom: 0; }
.wz-mitte { flex: 1; min-width: 0; }
.wz-name { font-weight: 800; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wz-proben { font-family: 'Scheherazade New', serif; font-size: 19px; color: var(--ink-soft);
  line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; }
.wz-zahl { flex: 0 0 auto; min-width: 30px; height: 30px; padding: 0 8px; border-radius: var(--r-pill);
  background: var(--rose-bg); color: var(--rose); font-weight: 900; font-size: 13px;
  display: grid; place-items: center; }
.wz-knopf { flex: 0 0 auto; padding: 8px 14px !important; font-size: 14px !important; }
.btn.btn-sm { padding: 8px 14px; font-size: 14px; box-shadow: 0 3px 0 var(--line-2); }
.btn.btn-sm:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line-2); }

/* ============================================================================
   SERIEN-AUFNAHME — Vollbild, ein Tipp pro Aufnahme
   ========================================================================== */
.serie { position: fixed; inset: 0; z-index: 300; background: var(--bg);
  display: flex; flex-direction: column; align-items: center;
  padding: calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px);
  overflow-y: auto; }
.serie-kopf { width: 100%; max-width: 560px; display: flex; align-items: center;
  justify-content: space-between; gap: 10px; }
.serie-stand { font-weight: 800; font-size: 14px; }
.serie-stand b { font-size: 19px; }
.serie-balken { width: 100%; max-width: 560px; height: 8px; border-radius: var(--r-pill);
  background: var(--line); overflow: hidden; margin: 12px 0 6px; }
.serie-balken i { display: block; height: 100%; border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--brand-2), var(--brand)); transition: width .4s var(--ease); }
.serie-karte { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-xl); box-shadow: var(--shadow-2); padding: 22px 18px; text-align: center;
  margin: 14px 0 4px; }
.serie-lektion { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-mute); margin-bottom: 10px; }
.serie-ar { font-family: 'Scheherazade New', serif; font-weight: 700; direction: rtl;
  font-size: clamp(40px, 13vw, 64px); line-height: 1.75; color: var(--ink); }
.serie-lat { font-size: 16px; font-weight: 800; color: var(--brand); margin-top: 6px; }
.serie-schon { font-size: 12.5px; font-weight: 700; color: var(--success); margin-top: 10px; }
.serie-mic { width: 108px; height: 108px; border-radius: 50%; margin: 18px auto 8px; display: grid;
  place-items: center; font-size: 42px; color: #fff; border: none; cursor: pointer;
  background: linear-gradient(150deg, var(--brand-2), var(--brand)); box-shadow: var(--sh-brand);
  transition: transform .09s linear, background .2s; }
.serie-mic:active { transform: scale(.94) !important; }
.serie-mic.laeuft { background: linear-gradient(150deg, var(--rose-2), var(--rose));
  box-shadow: 0 0 0 10px rgba(194,76,60,.14), 0 8px 26px rgba(194,76,60,.35); }
.serie-mic[disabled] { filter: grayscale(.5) opacity(.6); }
.serie-hinweis { font-size: 14.5px; font-weight: 700; color: var(--ink-soft); text-align: center;
  max-width: 420px; line-height: 1.4; }
.serie-fehler { color: var(--rose); font-weight: 800; font-size: 13.5px; margin-top: 8px; }
.serie .row { width: 100%; max-width: 560px; }
.serie-fuss { width: 100%; max-width: 560px; display: flex; align-items: center;
  justify-content: space-between; gap: 10px; margin-top: 16px; }
.serie-auto { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 800;
  color: var(--ink-soft); cursor: pointer; }
.serie-tipp { max-width: 560px; text-align: center; font-size: 12.5px; margin-top: 14px; line-height: 1.5; }
.serie-bilanz { margin-top: 10px; font-weight: 800; color: var(--brand); font-size: 14px; }
@media (max-height: 700px) {
  .serie-karte { padding: 14px; margin: 10px 0 2px; }
  .serie-mic { width: 88px; height: 88px; font-size: 34px; margin: 12px auto 6px; }
  .serie-ar { font-size: clamp(32px, 11vw, 48px); }
}

/* ============================================================================
   ALTE FARBNAMEN — Brücke zur neuen Palette (06.09.2026)
   Über 50 Stellen im Code stehen als var(--muted, #8aa4bd) o. Ä. da. Solange
   diese Namen nicht definiert waren, griff überall der EINGEBAUTE Rückfallwert
   — und der war noch blaugrau aus der alten Farbwelt. Hier bekommen sie ihre
   Entsprechung in der neuen Palette; damit ziehen sie automatisch mit, auch
   im Dunkelmodus.
   ========================================================================== */
:root, .theme-dark {
  --muted: var(--ink-mute);
  --muted-strong: var(--ink-soft);
  --card: var(--surface);
  --danger: var(--rose);
  --rose-2: var(--rose-soft-strong);
  --rose-soft: var(--rose-bg);
  --success-soft: var(--success-bg);
  --warn-soft: var(--gold-soft);
  --brand-soft: var(--accent-soft);
  --sky-10: var(--sapphire-soft);
  --mint-ink: var(--brand);
  --f-ui: 'Geist', ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
:root { --rose-soft-strong: #F26D89; }
.theme-dark { --rose-soft-strong: #FF8FA6; }

/* ============================================================================
   AXI, DER AXOLOTL — Bewegung (11.0)
   Er lebt: atmet, blinzelt alle paar Sekunden, schaut sich um, die Kiemen
   wippen versetzt, der Schwanz wedelt. Jede Stimmung hat ihr eigenes Bild:
   jubeln = hüpfen mit Armen hoch, traurig = hängende Kiemen, schlafen = Zzz.
   Alles CSS, keine Bilddatei; „weniger Bewegung" wird respektiert.
   ========================================================================== */
.rahle { overflow: visible; }

/* ============ DIE HALTUNG DES RAHLE (15.09.2026) ============
   Das Maskottchen ist ein Gegenstand — kein Gesicht, keine Augen. Seine
   Stimmung steht im GELENK: Das Kreuz öffnet sich weit, wenn es etwas zu
   freuen gibt, und klappt zusammen, wenn es spät wird. Dazu neigt sich das
   Ganze, und der Mushaf darauf hebt oder senkt sich.

   Die Bretter sind in der Zeichnung senkrecht gebaut und tragen dort ein
   transform-Attribut für die Ruhelage. Sobald hier eine CSS-Drehung steht,
   gilt nur noch sie — deshalb bringt JEDE Haltung ihre beiden Winkel mit. */
.rahle .bein-l, .rahle .bein-r, .rahle .buch, .rahle .ganz, .rahle .schatten, .rahle .glanz {
  transition: transform .6s var(--e-pop), opacity .5s ease;
}
.rahle .bein-l   { transform-origin: 140px 150px; }
.rahle .bein-r   { transform-origin: 140px 150px; }
.rahle .buch     { transform-origin: 138px 62px; }
.rahle .ganz     { transform-origin: 140px 240px; }
.rahle .schatten { transform-origin: 140px 249px; }

/* Ruhe — der Grundzustand */
.rahle--happy .bein-l { transform: rotate(-21deg); }
.rahle--happy .bein-r { transform: rotate(21deg); }
.rahle--happy .glanz  { opacity: .5; }

/* Freude — weit offen, und das Stück hüpft */
.rahle--cheer .bein-l { transform: rotate(-27deg); }
.rahle--cheer .bein-r { transform: rotate(27deg); }
.rahle--cheer .buch   { transform: translateY(-7px) rotate(-2deg); }
.rahle--cheer .glanz  { opacity: 1; }
.rahle--cheer .ganz   { animation: rahleHuepf 1.15s var(--e-pop) infinite; }
.rahle--cheer .schatten { animation: rahleSchatten 1.15s var(--e-pop) infinite; }
@keyframes rahleHuepf { 0%, 100% { transform: translateY(0) rotate(0deg); } 40% { transform: translateY(-16px) rotate(-2deg); } 70% { transform: translateY(0) rotate(1deg); } }
@keyframes rahleSchatten { 0%, 100% { transform: scale(1); opacity: .38; } 40% { transform: scale(.8); opacity: .2; } }

/* Nachdenken — schief gestellt, das Buch gekippt, ein langsames Wiegen */
.rahle--think .bein-l { transform: rotate(-19deg); }
.rahle--think .bein-r { transform: rotate(23deg); }
.rahle--think .buch   { transform: rotate(-7deg); }
.rahle--think .glanz  { opacity: .3; }
.rahle--think .ganz   { animation: rahleWiegen 3.4s ease-in-out infinite; }
@keyframes rahleWiegen { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

/* Müde — das Kreuz fast zu, der Mushaf sinkt zwischen die Bretter */
.rahle--sleep .bein-l   { transform: rotate(-9deg); }
.rahle--sleep .bein-r   { transform: rotate(9deg); }
.rahle--sleep .buch     { transform: translateY(15px) scale(.88); }
.rahle--sleep .ganz     { transform: translateY(10px) rotate(2deg); }
.rahle--sleep .glanz    { opacity: .12; }
.rahle--sleep .schatten { transform: scale(.82); }

/* Daneben — enger als in Ruhe, leicht abgewandt, ohne jede Bewegung.
   Kein Trauern, kein Vorwurf: Ein Lesepult, das eine Antwort nicht gelten
   lässt, macht keine großen Gesten. */
.rahle--sad .bein-l   { transform: rotate(-13deg); }
.rahle--sad .bein-r   { transform: rotate(13deg); }
.rahle--sad .buch     { transform: translateY(7px) rotate(3deg); }
.rahle--sad .ganz     { transform: rotate(-4deg); }
.rahle--sad .glanz    { opacity: .1; }
.rahle--sad .schatten { transform: scale(.88); }

@media (prefers-reduced-motion: reduce) { .rahle *, .rahle-mini * { animation: none !important; } }

/* ============================================================================
   ANSTRICH 11.0 — „Nachthimmel & Axolotl" (07.09.2026)
   Steht ganz am Ende und überschreibt gezielt: Schrift, Knöpfe, Karten,
   Navigation, Startseite, Lernbildschirm, Dunkelmodus. Grundsatz: eine
   fühlbare Unterkante an allem, was man drücken kann; 2-px-Ränder statt
   Haarlinien; große Rundungen; Violett = handeln, Gold = Belohnung,
   Grün = richtig, Koralle = Wärme (das ist Axis Farbe).
   ========================================================================== */
/* ---------- 1. Schrift ---------- */
body { font-family: 'Nunito', 'Geist', 'Scheherazade New', ui-rounded, system-ui, -apple-system, sans-serif;
  font-size: 15px; letter-spacing: 0; font-feature-settings: normal; }
.page h1 { font-weight: 900; font-size: 27px; letter-spacing: -.015em; }
.page h2 { font-weight: 900; font-size: 19px; letter-spacing: -.01em; }
.hero-title, .streak-head h2 { font-family: inherit; font-weight: 900; }
/* ---------- 2. Knöpfe ---------- */
.btn { border-radius: 16px; font-weight: 800; font-size: 15.5px; padding: 13px 20px; letter-spacing: 0; }
.btn-primary, .btn-accent { background: var(--brand); color: #fff; box-shadow: 0 5px 0 var(--brand-3); }
.btn-primary:hover, .btn-accent:hover { background: var(--brand-2); }
.btn-primary:active, .btn-accent:active { transform: translateY(5px); box-shadow: 0 0 0 var(--brand-3); }
.btn-success { box-shadow: 0 5px 0 var(--success-3); }
.btn-success:active { transform: translateY(5px); box-shadow: 0 0 0 var(--success-3); }
.btn-ghost { background: var(--surface); border: 2px solid var(--line-2); box-shadow: 0 4px 0 var(--line-2); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--brand-soft-2); }
.btn-ghost:active { transform: translateY(4px); box-shadow: 0 0 0 var(--line-2); }
.btn-lg { padding: 16px 24px; font-size: 17px; border-radius: 18px; }
.btn.btn-sm { padding: 9px 14px; font-size: 14px; border-radius: 12px; }
.icon-btn { width: 38px; height: 38px; border: 2px solid var(--line); background: var(--surface); }
.pill { border: 2px solid var(--line); font-weight: 800; padding: 6px 13px; background: var(--surface); }
.avatar-btn { border: 2px solid var(--line); }
.close-btn { border: 2px solid var(--line); }
:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 3px; }
/* ---------- 3. Karten & Flächen ---------- */
.card { border: 2px solid var(--line); border-radius: var(--r-xl); }
.deck-card, .jump-card, .friend-card, .flashcard, .import-card, .mode-card, .code-card { border: 2px solid var(--line); border-radius: 20px; }
.deck-card { box-shadow: 0 4px 0 var(--line-2); }
.deck-card:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--line-2), var(--shadow-2); }
.deck-card:active { transform: translateY(2px) scale(1); box-shadow: 0 2px 0 var(--line-2); }
.deck-card .deck-name { font-weight: 900; font-size: 16px; }
.deck-card .swatch, .deck-head .swatch-lg { border-radius: 12px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.mode-card:hover { border-color: var(--brand-soft-2); }
.mode-card.is-selected { border-color: var(--brand); background: var(--accent-soft); border-width: 2px; }
.mode-card .mode-ttl { font-weight: 900; }
.tabs { gap: 4px; border-bottom: none; padding: 4px; background: var(--bg-2); border-radius: var(--r-pill); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; white-space: nowrap; padding: 8px 14px; border-radius: var(--r-pill); border-bottom: none; margin: 0; font-weight: 800; color: var(--ink-soft); }
.tab.is-active { background: var(--surface); color: var(--brand); box-shadow: var(--shadow-2); border-bottom: none; }
.section-head .title { font-size: 18px; font-weight: 900; }
.section-head .link { color: var(--brand); font-weight: 800; font-size: 13.5px; }
.stack-dot { border-radius: 5px; }
/* ---------- 4. Kopfzeile & Navigation ---------- */
.topbar { background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 2px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.sidebar { background: var(--surface); border-right: 2px solid var(--line); }
.logo { display: flex; align-items: center; gap: 9px; color: var(--brand); font-weight: 900; font-size: 22px; letter-spacing: -.02em; }
.logo i { font-style: normal; color: var(--koralle); }
.nav-item { border-radius: 14px; font-weight: 800; font-size: 15px; padding: 10px 12px; color: var(--ink-soft); }
.nav-item:hover { background: var(--bg-2); color: var(--ink); }
.nav-item.is-active { background: var(--accent-soft); color: var(--brand); box-shadow: none; }
.stack-row { font-weight: 700; border-radius: 12px; }
.stack-row.is-active { background: var(--accent-soft); color: var(--brand); box-shadow: none; }
.stacks-head { text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 800; }
@media (max-width: 860px) {
  .mobilenav { background: var(--surface) !important; border-top: 2px solid var(--line);
    box-shadow: 0 -8px 24px rgba(46,36,112,.08) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  .mn-item { color: var(--ink-mute); font-weight: 800; font-size: 10.5px; gap: 2px; border-radius: 0; }
  .mn-item .mn-ico, .mn-item .nav-icon { display: grid; place-items: center; width: 48px; height: 30px; border-radius: 12px;
    transition: background .2s, transform .24s var(--e-pop); }
  .mn-item.is-active { color: var(--brand); background: transparent; }
  .mn-item.is-active .mn-ico, .mn-item.is-active .nav-icon { background: var(--accent-soft); transform: none; }
  .mn-item.is-active::after { display: none; }
  .mn-item.is-active svg { transform: none; }
}
/* ---------- 5. Startseite „Heute" ---------- */
.heute-kopf { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding: 2px 0 8px; }
.heute-text { flex: 1; min-width: 0; padding-bottom: 16px; }
.heute-gruss { font-size: 24px; font-weight: 900; letter-spacing: -.02em; line-height: 1.15; }
.heute-stufe { font-size: 14px; font-weight: 800; color: var(--brand); margin-top: 4px; }
.axi-buehne { position: relative; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; margin-right: -6px; }
.axi-blase { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
  padding: 7px 12px; font-size: 13px; font-weight: 800; color: var(--ink); text-align: center; max-width: 190px;
  box-shadow: var(--shadow-2); margin-bottom: 8px; animation: blaseAuf .5s var(--e-pop) .3s both; line-height: 1.25; }
.axi-blase::after { content: ''; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; margin-left: -6px;
  background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
@keyframes blaseAuf { from { opacity: 0; transform: translateY(6px) scale(.9); } to { opacity: 1; transform: none; } }
.ziel-karte { background: linear-gradient(150deg, var(--brand-2), var(--brand) 55%, var(--brand-3));
  box-shadow: 0 6px 0 var(--brand-3), var(--sh-brand); border-radius: var(--r-xl); }
.ziel-karte::before { opacity: .10; }
.zr-bar { stroke: var(--gold-2); }
.ziel-pill { background: rgba(255,255,255,.18); }
.w-pk { background: var(--bg-2); font-weight: 900; }
.w-tag.ist-an .w-pk { background: var(--brand); color: #fff; box-shadow: 0 3px 0 var(--brand-3); }
.w-tag.ist-gold .w-pk { background: var(--gold); color: #fff; box-shadow: 0 3px 0 var(--gold-3); }
.w-tag.ist-heute .w-pk { border-color: var(--brand); }
.weiter-knopf { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; box-shadow: 0 5px 0 var(--line-2); padding: 14px 16px; }
.weiter-knopf:active { transform: translateY(5px); box-shadow: 0 0 0 var(--line-2); }
.wk-ico { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--accent-soft); font-size: 22px; }
.wk-txt b { font-size: 17px; font-weight: 900; }
.wk-pfeil { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center;
  font-size: 18px; box-shadow: 0 3px 0 var(--brand-3); }
.home-hero .card { border: 2px solid var(--line); border-radius: 20px; }
.loading-shell .mascot-anim { animation: none; }
@media (max-width: 380px), (max-height: 660px) {
  .heute-kopf .rahle { width: 98px !important; height: 98px !important; }
  .axi-blase { font-size: 12px; padding: 6px 10px; max-width: 150px; }
  .heute-text { padding-bottom: 10px; }
}
/* ---------- 6. Lernpfad ---------- */
.pfad-start { color: var(--brand); border: 2px solid var(--line); text-transform: none; letter-spacing: 0; font-size: 12.5px; }
.pfad-start::after { border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); }
.pfad-ziel { border: 2px dashed var(--gold); }
.pk-schloss { border: 2px solid var(--line); }
/* ---------- 7. Lernbildschirm ---------- */
.quiz-shell.qp-skin { background: linear-gradient(178deg, var(--accent-soft) 0%, var(--bg) 40%, var(--bg) 100%) !important; }
.qp-skin .quiz-topbar { background: linear-gradient(135deg, var(--brand-2), var(--brand));
  box-shadow: 0 6px 0 var(--brand-3), 0 10px 24px rgba(106,90,224,.25); border-radius: 0 0 24px 24px; }
.qp-skin .quiz-progress .bar { background: linear-gradient(90deg, var(--gold), var(--gold-2)); box-shadow: 0 0 10px rgba(255,211,92,.6); }
.qp-skin .qp-cardlabel { background: linear-gradient(135deg, var(--brand-2), var(--brand-3)) !important; }
.qp-skin .qp-cardbody, .qp-skin .qp-ansfield { border-color: var(--brand); }
.option { border-radius: 18px; }
.qp-skin .options .option { border: 2px solid var(--line); border-bottom-width: 2px; box-shadow: 0 5px 0 var(--line-2); border-radius: 18px; font-weight: 800; }
.qp-skin .options .option:hover:not(.is-disabled):not(.is-correct):not(.is-wrong) { border-color: var(--brand-soft-2);
  box-shadow: 0 5px 0 var(--line-2), 0 10px 20px rgba(46,36,112,.10); }
.qp-skin .options .option:active:not(.is-disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--line-2); }
.qp-skin .options .option.is-correct { background: var(--success-bg); color: var(--success-3); border-color: var(--success);
  box-shadow: 0 5px 0 var(--success-3); }
.qp-skin .options .option.is-wrong { background: var(--rose-bg); color: var(--rose-3); border-color: var(--rose);
  box-shadow: 0 5px 0 var(--rose-3); }
.question-card { border: 2px solid var(--brand); box-shadow: 0 0 0 4px var(--accent-soft); border-radius: 20px; }
.question-card .qtag { text-transform: none; letter-spacing: 0; color: var(--brand); font-weight: 800; }
.qp-btn { border-radius: 16px; }
.helper { border: 2px solid var(--line); border-radius: 14px; font-weight: 800; }
.ki-bubble { border: 2px solid var(--line); border-radius: 20px; }
.ki-bubble .mini-mascot, .tutor-head .mini-mascot { background: var(--accent-soft); }
/* ---------- 8. Rundenabschluss & Fortschritt ---------- */
.roundend-title-accent { color: var(--brand); }
.level-shield { background: linear-gradient(150deg, var(--brand-2), var(--brand) 60%, var(--brand-3)) !important;
  box-shadow: 0 5px 0 var(--brand-3), var(--sh-brand); border-radius: 18px; }
.xp-bar { height: 12px; background: var(--bg-2); }
.xp-bar .fill { background: linear-gradient(90deg, var(--brand-2), var(--brand)); }
.gem-card { background: linear-gradient(135deg, var(--gold-2), #FF9F43); border-radius: 20px; box-shadow: 0 5px 0 var(--gold-3); }
.gem-card.next { background: linear-gradient(135deg, var(--brand-2), var(--brand)); box-shadow: 0 5px 0 var(--brand-3); }
/* ---------- 9. Fenster & Formulare ---------- */
.scrim { background: rgba(30,27,58,.5); backdrop-filter: blur(3px); }
.modal { border-radius: 24px; }
.modal .modal-head { border-bottom: 2px solid var(--line); }
.modal .modal-head .ttl { font-weight: 900; font-size: 18px; }
.modal .modal-foot { border-top: 2px solid var(--line); }
input[type="text"], input[type="password"], input[type="number"], input[type="search"], input[type="email"], textarea, select {
  border: 2px solid var(--line-2); border-radius: 14px; font-weight: 700; }
input:focus, textarea:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--accent-soft); }
.search-box { border: 2px solid var(--line); border-radius: 20px; }
/* ---------- 10. Dunkelmodus ---------- */
.theme-dark .btn-primary, .theme-dark .btn-accent, .theme-dark .btn-success, .theme-dark .qp-btn,
.theme-dark .qp-rate-ja, .theme-dark .qp-rate-nein, .theme-dark .pfad-knopf, .theme-dark .pfad-knopf.ist-fertig,
.theme-dark .w-tag.ist-an .w-pk, .theme-dark .w-tag.ist-gold .w-pk, .theme-dark .wk-pfeil, .theme-dark .level-shield { color: #15123A !important; }
.theme-dark .ziel-karte { background: linear-gradient(152deg, #2C2670, #221D5C 58%, #1A1648); border: 2px solid var(--line-2);
  box-shadow: 0 6px 0 #110E33; color: var(--ink); }
.theme-dark .ziel-titel { color: var(--brand-2); }
.theme-dark .qp-skin .quiz-topbar { background: var(--surface-2); box-shadow: 0 6px 0 var(--bg-2), 0 8px 24px rgba(0,0,0,.5); }
.theme-dark .qp-skin .qp-cardlabel { background: linear-gradient(135deg, #3B3390, #2C2670) !important; color: var(--ink); }
.theme-dark .quiz-shell.qp-skin { background: linear-gradient(178deg, #221D5C 0%, var(--bg) 40%) !important; }
.theme-dark .axi-blase, .theme-dark .axi-blase::after { background: var(--surface-2); }
.theme-dark .rahle .schatten { opacity: .5; }
.theme-dark .topbar { background: color-mix(in srgb, var(--bg) 86%, transparent); }
/* ---------- 11. Axi im Lernbildschirm ---------- */
.quiz-axi { display: inline-grid; place-items: center; width: 42px; height: 42px; flex: 0 0 42px; margin: -4px 0; }
.quiz-axi .rahle { transition: transform .3s var(--e-pop); }
.quiz-axi .rahle--cheer { transform: scale(1.18) translateY(-2px); }
.quiz-axi .rahle--sad { transform: scale(1.1) translateY(1px); }
/* ---------- 12. Belohnungsschleifen (11.0) ----------
   Combo-Rand, goldene +XP-Pille, Sterne, perfekte Runde, Geschenk,
   Level-Aufstieg, flackernde Serie, Tagesaufgaben mit Tageskiste. */
.quiz-shell.hat-combo::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 3;
  box-shadow: inset 0 0 0 3px var(--gold-2), inset 0 0 44px rgba(255,211,92,.28); animation: comboRand 1.4s ease-in-out infinite; }
@keyframes comboRand { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
.combo-pill { background: linear-gradient(135deg, var(--gold-2), var(--gold)) !important; color: #4A3200 !important;
  border-color: var(--gold) !important; animation: comboPuls 1.1s ease-in-out infinite; }

  40% { transform: translate(-50%, -2px) scale(1); } 100% { transform: translate(-50%, -42px) scale(.95); opacity: 0; } }
.xp-float.xp-float-big { font-size: 19px; animation-duration: 1.65s; }
.re-sterne { display: flex; justify-content: center; gap: 6px; font-size: 46px; line-height: 1; margin: -4px 0 2px; }

.aufgaben { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 14px 14px 12px; display: grid; gap: 10px; }

/* ---------- 14. Klassenzimmer mit Code (11.0) ---------- */

/* ============================================================================
   ANSTRICH 11.13 — „Ruhe & Tiefe" (23.09.2026)

   Nuri: „Das Ganze nochmal sehr luxuriös, so wie eine iOS-Apple-App aussehen."

   Steht NACH dem Anstrich 11.0 und überschreibt ihn gezielt. Drei Berater
   (Apple-HIG, Luxus, Kinder-Alltag) waren sich in einem Punkt einig: Die
   5-Pixel-Unterkante und die 2-Pixel-Ränder der 11.0-Schicht sind das, was
   die App nach Spielzeug aussehen lässt. Tiefe kommt jetzt aus Flächen —
   getönter Grund, weiße Karte, Haarlinie, ein weicher Schatten mit viel
   Unschärfe — nicht aus Rändern. Farbe sparsam: Violett heißt „hier kannst
   du etwas tun", Gold heißt Belohnung, sonst ruhig.

   Was bleibt: Nunito, die Marke, der Rahle, beide Sprachen, der Dunkelmodus
   über Tokens. Was nicht angefasst wird: Lernbildschirm und Quiz — dort ist
   der kräftige Stil Absicht (große Ziele für kleine Finger).
   ========================================================================== */
:root {
  --haar: color-mix(in srgb, var(--ink) 9%, transparent);
  --haar-stark: color-mix(in srgb, var(--ink) 14%, transparent);
  --schicht-1: 0 1px 2px rgba(46,36,112,.04), 0 6px 20px rgba(46,36,112,.06);
  --schicht-2: 0 2px 6px rgba(46,36,112,.06), 0 16px 40px rgba(46,36,112,.10);
  --schicht-brand: 0 6px 18px rgba(106,90,224,.26);
  --glas: color-mix(in srgb, var(--surface) 86%, transparent);
}
.theme-dark {
  --haar: color-mix(in srgb, var(--ink) 12%, transparent);
  --haar-stark: color-mix(in srgb, var(--ink) 18%, transparent);
  --schicht-1: 0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.28);
  --schicht-2: 0 2px 6px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.45);
  --schicht-brand: 0 6px 18px rgba(143,130,255,.22);
  --glas: color-mix(in srgb, var(--surface) 82%, transparent);
}

/* ---------- 1. Schrift: weniger Schwarz, mehr Ruhe ---------- */
.page h1 { font-weight: 800; font-size: 28px; letter-spacing: -.022em; }
.page h2 { font-weight: 800; font-size: 19px; letter-spacing: -.014em; }
.section-head .title { font-weight: 800; font-size: 17px; }
.heute-gruss { font-weight: 800; }
.deck-card .deck-name { font-weight: 800; }

/* ---------- 2. Knöpfe: gefüllt oder getönt, nie mit Unterkante ---------- */
.btn { border-radius: 14px; font-weight: 800; font-size: 15px; padding: 12px 18px; border: 0; box-shadow: none;
  transition: transform .12s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease), color .15s var(--ease); }
.btn-primary, .btn-accent { background: var(--brand); color: #fff; box-shadow: var(--schicht-brand); }
.btn-primary:hover, .btn-accent:hover { background: var(--brand-2); box-shadow: var(--schicht-brand); }
.btn-primary:active, .btn-accent:active { transform: scale(.98); box-shadow: 0 2px 8px rgba(106,90,224,.2); }
.btn-success { background: var(--success); color: #fff; box-shadow: 0 6px 18px rgba(46,196,110,.24); }
.btn-success:active { transform: scale(.98); box-shadow: none; }
.btn-ghost { background: var(--surface-2); color: var(--ink); border: 1px solid transparent; box-shadow: none; }
.btn-ghost:hover { background: color-mix(in srgb, var(--surface-2) 70%, var(--accent-soft)); border-color: transparent; }
.btn-ghost:active { transform: scale(.98); box-shadow: none; }
.btn-lg { padding: 15px 22px; font-size: 16.5px; border-radius: 16px; }
.btn.btn-sm { padding: 8px 12px; font-size: 13.5px; border-radius: 11px; }
.btn:disabled { transform: none; }
.icon-btn { width: 38px; height: 38px; border: 1px solid var(--haar); background: var(--surface); box-shadow: none; }
.icon-btn:hover { background: var(--surface-2); }
.close-btn { border: 1px solid var(--haar); }
.avatar-btn { border: 1px solid var(--haar); }
.pill { border: 1px solid var(--haar); font-weight: 700; padding: 6px 12px; background: var(--surface); }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }

/* ---------- 3. Karten und Flächen: Haarlinie und weiche Schicht ---------- */
.card { border: 1px solid var(--haar); border-radius: 20px; box-shadow: var(--schicht-1); }
.card.flat { box-shadow: none; }
.deck-card, .jump-card, .friend-card, .flashcard, .import-card, .mode-card, .code-card { border: 1px solid var(--haar); border-radius: 18px; }
.deck-card { box-shadow: var(--schicht-1); }
.deck-card:hover { transform: translateY(-2px); box-shadow: var(--schicht-2); }
.deck-card:active { transform: scale(.99); box-shadow: var(--schicht-1); }
.mode-card:hover { border-color: var(--haar-stark); box-shadow: var(--schicht-1); }
.mode-card.is-selected { border-color: var(--brand); background: var(--accent-soft); border-width: 1px; box-shadow: 0 0 0 1px var(--brand) inset; }
.klassen-banner { border: 1px solid var(--haar); box-shadow: var(--schicht-1); }
.code-block { border: 1px solid transparent; }
.tabs { background: var(--surface-2); padding: 3px; }
.tab { padding: 7px 13px; font-weight: 800; }
.tab.is-active { box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 0 0 1px var(--haar); }
.muenz-quellen { border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); }

/* ---------- 4. Kopfzeile, Seitenleiste, Fußleiste: Milchglas ---------- */
.topbar { background: var(--glas); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--haar); }
.sidebar { background: var(--surface); border-right: 1px solid var(--haar); }
.nav-item { border-radius: 12px; font-weight: 700; }
.nav-item.is-active { background: var(--accent-soft); color: var(--brand); }
.stack-row { font-weight: 600; }
.stack-row.is-active { font-weight: 800; }
@media (max-width: 860px) {
  .mobilenav { background: var(--glas) !important; border-top: 1px solid var(--haar); box-shadow: none !important;
    backdrop-filter: blur(18px) saturate(1.4) !important; -webkit-backdrop-filter: blur(18px) saturate(1.4) !important; }
  .mn-item { font-weight: 700; }
}

/* ---------- 5. Fenster: rund, tief, Haarlinie ---------- */
.modal { border-radius: 26px; box-shadow: var(--schicht-2), 0 40px 90px rgba(20,16,50,.28); border: 1px solid var(--haar); }
.modal .modal-head { border-bottom: 1px solid var(--haar); padding: 16px 20px; }
.modal .modal-head .ttl { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.modal .modal-foot { border-top: 1px solid var(--haar); }
.theme-dark .modal { box-shadow: var(--schicht-2), 0 40px 90px rgba(0,0,0,.6); }

/* ---------- 6. Eingaben: gefüllt, ruhig, klarer Fokus ---------- */
input[type="text"], input[type="password"], input[type="search"], input[type="email"], input[type="number"], input:not([type]), textarea, .code-eingabe {
  border: 1px solid var(--haar) !important; background: var(--surface) !important; border-radius: 13px !important;
  transition: border-color .15s ease, box-shadow .15s ease; }
input[type="text"]:focus, input[type="password"]:focus, input[type="search"]:focus, input[type="email"]:focus, input[type="number"]:focus, input:not([type]):focus, textarea:focus, .code-eingabe:focus {
  outline: none; border-color: var(--brand) !important; box-shadow: 0 0 0 3px var(--accent-soft); }

:root {

.page.kz { max-width: 640px; gap: 18px; padding-top: 4px; }

/* Kopf */
.kz-kopf { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

.kz-rund { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--kz-haar); color: var(--ink-soft); flex: 0 0 40px; transition: background .15s ease, transform .12s ease; }
.kz-rund:active { transform: scale(.94); }
.kz-rund:hover { background: var(--surface-2); }

/* Der Code */
.kz-codekarte { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 92%, #000) 0%, var(--brand) 55%, var(--brand-2) 100%);
  color: #fff; border-radius: 22px; padding: 18px 20px; box-shadow: 0 12px 32px rgba(106,90,224,.28); overflow: hidden; }

.kz-codekarte > * { position: relative; }
.kz-codekarte--leer { display: grid; gap: 8px; }

/* Weiche Knöpfe (tinted), leise Knöpfe (nur Text) */
.kz-weich { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 16px; border-radius: 14px;

.kz-kind { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 66px; padding: 11px 14px 11px 14px; background: transparent; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; transition: background .12s ease; -webkit-tap-highlight-color: transparent; }

  color: hsl(var(--h) 45% 32%); background: linear-gradient(160deg, hsl(var(--h) 70% 92%), hsl(var(--h) 60% 84%)); box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }

.kz-kind-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.kz-kind-text b { font-weight: 800; font-size: 16px; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.kz-schalter { position: relative; width: 51px; height: 31px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 14%, transparent); border: 0; padding: 0; cursor: pointer; flex: 0 0 51px; transition: background .2s ease; }

/* ============================================================================

   ---------------------------------------------------------------------------
   Sucht deutschen Text dort, wo er stört: auf dem Bildschirm.

   Bisher wurde im QUELLTEXT gezählt (tools/pruefe-deutsch.mjs). Das findet,

if (/[?&]pruef=1/.test(location.search) && /[?&]sprache=1/.test(location.search)) (function () {
  function lauf() {

              for (var m = 0; m < neu2.length; m++) if (sicht(neu2[m])) knoepfe.push(neu2[m]);
            }

        }, 1400);

    }

      var links = [].slice.call(spalten[0].querySelectorAll('.qp-pair')).filter(sichtbar);
      var rechts = [].slice.call(spalten[1].querySelectorAll('.qp-pair')).filter(sichtbar);
      if (links.length && rechts.length) {
        links[0].click();
        setTimeout(function () { rechts[0].click(); }, 120);
        return true;
      }
    }
    /* Reihenfolge nach Fragetyp. `.qp-rate` ist die Selbsteinschaetzung
       („Ja · Vage · Nein") der Abruf-Karten — ohne sie bleibt die Probe in
       der Şedde-Tafel nach fuenf Karten stehen. Auch das war ein Mangel der
       Probe, nicht der App. */
    /* `.qi-start` ist „Lernen beginnen" auf der Einfuehrungsseite, die seit
       dem 11.09.2026 beim ERSTEN Betreten einer Lektion von selbst aufgeht.
       Ohne sie bleibt die Probe gleich auf der ersten Seite stehen. */
    var kandidaten = ['.qi-start', 'button.option:not(.is-disabled)', '.qp-rate', '.qp-btn', '.btn-primary', 'button.tf-btn', '.qp-tile', '.order-option'];
    for (var i = 0; i < kandidaten.length; i++) {
      var els = [].slice.call(q.querySelectorAll(kandidaten[i])).filter(sichtbar);
      if (els.length) { els[0].click(); return true; }
    }
    return false;
  }

  /* MIT &sprache=1 ACHTET DIE PROBERUNDE AUCH AUF DIE SPRACHE. (11.09.2026)

     Die Sprachprobe geht durch die Navigation und die Module — aber nie in
     eine Runde hinein. Genau dort verbringt ein Kind seine ganze Zeit, und
     genau dort stand „Welche Paare gehören zusammen?" auf Türkisch noch
     deutsch da, zusammen mit „28 Fehlversuche".

     Ein Durchgang, zwei Antworten: Die Runde spielt wie immer, sammelt dabei
     aber jeden sichtbaren Text der Quiz-Hülle ein. Das Ergebnis steht neben
     dem der Runde. */
  var sprachFunde = {};
  var SPRACHE_MIT = /[?&]sprache=1/.test(location.search);
  function sprachBlick() {
    if (!SPRACHE_MIT) return;
    var W = window.SPRACHE_TR || {};
    var q = document.querySelector('.quiz-shell') || document.body;
    var DE = /ß|ä|\b(und|der|die|das|nicht|mit|für|ist|wird|kann|eine|oder|noch|schon|hier|alle|kein|von|zum|zur|aus|über|nach|vor|durch|ohne|gegen|Karten|Stapel|Fragen|Frage|Antwort|Silben|Reihenfolge|Fehlversuch|Fehlversuche|Paare|gehören|richtig|falsch|weiter)\b/;
    var alle = q.querySelectorAll('*');
    for (var i = 0; i < alle.length; i++) {
      var el = alle[i];
      if (el.children.length || !el.offsetWidth) continue;
      var t = (el.innerText || '').replace(/\s+/g, ' ').trim();
      if (!t || t.length < 4 || t.length > 200) continue;
      if (/^[\d\s%·/.,:+-]+$/.test(t) || /[\u0600-\u06FF]/.test(t)) continue;
      var istWert = false;
      for (var k in W) if (String(W[k]) === t) { istWert = true; break; }
      if (istWert) continue;
      if (W[t] !== undefined && W[t] !== t) sprachFunde['unübersetzt · ' + t] = 1;
      else if (DE.test(t)) sprachFunde['verdächtig · ' + t] = 1;
    }
  }

  /* PASST DIE KARTE AUF EINEN HANDY-BILDSCHIRM? (14.09.2026)

     Nuri mit zwei Bildschirmfotos vom iPhone: Die Frage steht oben, die
     Antworten reichen unten hinaus. Man muss scrollen, um alle zu sehen —
     und beim Scrollen rutscht die Kopfzeile unter die Statusleiste des
     Telefons. Gemessen wird deshalb bei JEDER Karte, ob die Seite hoeher
     ist als das Fenster. Dafuer muss die Probe in Handy-Groesse laufen
     (Vorschau auf 393x852 stellen); die gemessene Fenstergroesse steht im
     Ergebnis, damit niemand eine Messung am Rechnerbildschirm fuer eine
     Handy-Messung haelt. */
  var zuHoch = {};
  function hoehenBlick() {
    if (!document.querySelector('.quiz-shell')) return;
    /* Nur echte FRAGE-Ansichten messen. Die Einfuehrung einer Lektion und der
       Rundenabschluss sind Lese-Seiten — die duerfen laenger sein als der
       Bildschirm, dort scrollt man selbstverstaendlich. Ohne diese Trennung
       meldete die Probe deren Laenge als Befund (313 Punkte) und verdeckte
       damit die echte Zahl der Frage-Karten. (14.09.2026) */
    if (!document.querySelector('.quiz-shell .options, .quiz-shell .qp-paircol, .quiz-shell .qp-tiles')) return;
    /* Gemessen wird die Unterkante der QUIZ-HUELLE, nicht die der Seite: Die
       Pruefhilfe haengt mit ?pruef=1 einen langen Bericht ans Dokument, und der
       machte die Seite um rund 300 Punkte laenger — die Probe meldete dann
       ihren eigenen Bericht als Befund. (14.09.2026, beim Nachmessen bemerkt) */
    var q = document.querySelector('.quiz-shell');
    var ueber = Math.round(q.getBoundingClientRect().bottom + (document.scrollingElement || document.documentElement).scrollTop - window.innerHeight);
    if (ueber <= 4) return;
    var art = ((document.querySelector('.qp-cardlabel') || {}).innerText || 'Karte').split('\n')[0].trim();
    var n = document.querySelectorAll('.quiz-shell .option').length;
    var schl = art + (n ? ' · ' + n + ' Antworten' : '');
    if (!zuHoch[schl] || zuHoch[schl] < ueber) zuHoch[schl] = ueber;
  }

  function schritt() {
    sprachBlick();
    hoehenBlick();
    if (karten >= MAX || ende) return fertig();
    var jetzt = text();
    if (jetzt === letzte) { gleich++; } else { gleich = 0; letzte = jetzt; }
    /* Bleibt dieselbe Karte stehen, erst ueberspringen — dann erst aufgeben.

       Manche Karten kann eine Maschine gar nicht loesen: „Baue das Wort"
       verlangt die RICHTIGE Reihenfolge der Silben, und die kennt die Probe
       nicht. Ohne diesen Ausweg meldet sie dort „stehen" und sieht aus wie ein
       Befund — dabei waere es nur ihre eigene Grenze. Ein Kind hat denselben
       Ausweg: den Ueberspringen-Pfeil oben. */
    if (gleich === 7) {
      var skip = document.querySelector('.quiz-shell .qp-skip');
      if (skip && sichtbar(skip)) { skip.click(); gleich = 0; letzte = ''; }
    }
    if (gleich >= 14) { stehen = jetzt.slice(0, 160); return fertig(); }
    if (/roundend|re-sterne/.test(document.body.className) || document.querySelector('.re-sterne')) { ende = true; return fertig(); }
    if (tippe()) karten++;
    setTimeout(schritt, 700);
  }

  function fertig() {
    var ergebnis = { karten: karten, fehler: fehler, ende: ende, stehen: stehen,
                     fenster: [window.innerWidth, window.innerHeight] };
    if (Object.keys(zuHoch).length) ergebnis.zuHoch = zuHoch;
    if (SPRACHE_MIT) ergebnis.deutsch = Object.keys(sprachFunde);
    var pre = document.getElementById('probe') || document.createElement('pre');
    pre.id = 'probe';
    pre.textContent = JSON.stringify(ergebnis, null, 1);
    document.body.appendChild(pre);
    reiheWeiter(ergebnis);
  }

  /* ---------- EINE REIHE VON LEKTIONEN AM STUECK (11.09.2026) ----------

     `&reihe=quran-harfler,quran-formen,…` spielt eine Lektion nach der
     anderen durch, jede mit frisch geleertem Speicher, und sammelt die
     Ergebnisse in sessionStorage unter `probe_reihe`. Am Ende steht alles
     zusammen in <pre id="probe-reihe">.

     Vorher musste jede der 17 Lektionen einzeln angestossen und einzeln
     nachgesehen werden — siebzehnmal warten, siebzehnmal ablesen. Ein
     vollstaendiger Durchlauf war damit so muehsam, dass er nicht nach jeder
     Aenderung gemacht wurde. Genau dann nuetzt eine Probe aber am meisten. */
  function reiheWeiter(ergebnis) {
    var m = /[?&]reihe=([^&]+)/.exec(location.search);
    if (!m) return;
    var liste = decodeURIComponent(m[1]).split(',').filter(Boolean);
    var jetzt = (/[?&]stapel=([^&]+)/.exec(location.search) || [])[1] || '';
    var sammlung = [];
    try { sammlung = JSON.parse(sessionStorage.getItem('probe_reihe') || '[]'); } catch (e) {}
    sammlung.push(Object.assign({ stapel: decodeURIComponent(jetzt) }, ergebnis));
    try { sessionStorage.setItem('probe_reihe', JSON.stringify(sammlung)); } catch (e) {}

    var i = liste.indexOf(decodeURIComponent(jetzt));
    var naechste = liste[i + 1];
    if (!naechste) {
      var p2 = document.createElement('pre');
      p2.id = 'probe-reihe';
      p2.textContent = JSON.stringify(sammlung, null, 1);
      document.body.appendChild(p2);
      return;
    }
    /* Frischer Speicher fuer jede Lektion: Nur so laeuft die Einfuehrung
       wieder von selbst auf und die Lehrkarte kommt wirklich als erste.

       DIE SPRACHWAHL UEBERLEBT DAS. (11.09.2026) Sie liegt im selben Speicher,
       und ohne diese Ausnahme lief die Reihe ab Lektion 2 wieder auf Deutsch —
       eine Sprachprobe, die sich selbst die Sprache umstellt, misst nichts.
       Denselben Fehler hatte ich schon einmal: Der erste Durchlauf der
       Sprachprobe klickte die DE-Pille mit. */
    var sprache = null;
    try { sprache = localStorage.getItem('eb_sprache_v1'); } catch (e) {}
    try { localStorage.clear(); } catch (e) {}
    try { if (sprache) localStorage.setItem('eb_sprache_v1', sprache); } catch (e) {}
    var basis = location.pathname + '?pruef=1&spiel=1&reihe=' + encodeURIComponent(liste.join(','))
      + '&stapel=' + encodeURIComponent(naechste)
      + ((/[?&]karten=(\d+)/.exec(location.search) || [])[1] ? '&karten=' + /[?&]karten=(\d+)/.exec(location.search)[1] : '');
    location.replace(basis);
  }

  /* Direkt in die Runde, statt sich durch die Oberflaeche zu klicken.

     Der erste Anlauf hat versucht, wie ein Kind zu tippen: Lektion suchen,
     Modus-Fenster wegklicken, Runde starten. Das ist an den Beschriftungen
     gescheitert — die App spricht zwei Sprachen, und die Knoepfe heissen je
     nach Bildschirm anders. Gemessen werden soll ohnehin die RUNDE, nicht
     der Weg dorthin: Die Adresse #quiz oeffnet sie mit der ersten
     Kuran-Lektion, das kann der Router seit Fassung 11.0. */
  /* Der Sprung steht in der ADRESSE, nicht im sessionStorage. Ein Merker im
     Speicher ueberlebt einen abgebrochenen Lauf und blockiert dann den
     naechsten — genau das ist beim ersten Versuch passiert: Der Merker stand
     noch, der Sprung unterblieb, und die Proberunde tippte auf der
     Stapel-Seite ins Leere. In der Adresse ist er selbsterklaerend und immer
     richtig.

     Und: Nur die Raute zu setzen laedt nicht neu; die App liest sie aber nur
     beim Start. Deshalb der volle Sprung mit location.replace. */
  if (!/^#quiz$/.test(location.hash)) {
    if (!/[?&]gesprungen=1/.test(location.search)) {
      location.replace(location.pathname + location.search + '&gesprungen=1#quiz');
      return;
    }
  }
  setTimeout(schritt, 3000);
})();
</script>

</body></html>
