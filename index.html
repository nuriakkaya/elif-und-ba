<style>/* ============ LERN APP — Tokens & base ============ */
:root {
  /* ---------------------------------------------------------------
     FARBWELT 11.0 — „Nachthimmel & Axolotl" (07.09.2026)
     Zurück zum kühlen Blau-Lila von früher, aber satter und klarer:
     weißer Grund mit einem Hauch Lavendel, kräftiges Violett als
     Leitfarbe, Gold für Belohnung, Koralle für das Maskottchen.
     Die alten Namen bleiben — jede bestehende Regel zieht mit.
     --------------------------------------------------------------- */
  /* Flächen */
  --bg: #F6F5FF;
  --bg-2: #ECEAFB;
  --surface: #FFFFFF;
  --surface-2: #F9F8FF;
  --line: #E4E1F5;
  --line-2: #CFCBEA;
  /* Schrift */
  --ink: #1E1B3A;
  --ink-soft: #5A567A;
  --ink-mute: #8B87A8;
  /* Leitfarbe: kräftiges Violett */
  --accent: #6A5AE0;
  --accent-soft: #EEEBFF;
  --brand: #6A5AE0;
  --brand-2: #7F71F5;
  --brand-3: #5142C2;
  --brand-ink: #2D2470;
  --brand-soft-2: #DCD7FF;
  /* Koralle — die Kiemen des Axolotls, Wärme neben dem Violett */
  --koralle: #FF7A9E;
  --koralle-2: #FFB1C4;
  --koralle-soft: #FFE9EF;
  /* Gold für Belohnung, Serie, Krone */
  --gold: #F5B000;
  --gold-2: #FFD35C;
  --gold-3: #C98A00;
  --gold-soft: #FFF3D1;
  /* Zustände */
  --success: #2EC46E;
  --success-bg: #E2F8EB;
  --success-3: #1E9A55;
  --warn: #F5B000;
  --rose: #F0476A;
  --rose-bg: #FFE6EC;
  --rose-3: #C42F4F;
  --sapphire: #3D8BFD;
  --sapphire-soft: #E4EFFF;
  --premium-a: #7F71F5;
  --premium-b: #C86DD7;
  /* Stapelfarben — kräftige Pastelle */
  --stack-lavender: #B9A9FF;
  --stack-blue: #8FB6FF;
  --stack-mint: #7EDBC4;
  --stack-green: #B5D97A;
  --stack-yellow: #FFD66B;
  --stack-orange: #FFAD70;
  --stack-rose: #FF9CB3;
  --stack-pink: #E7A0F0;
  --stack-coal: #2A2650;
  /* Form — rund und freundlich */
  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;
  /* Schatten — violett getönt */
  --shadow-1: 0 1px 2px rgba(46, 36, 112, 0.06);
  --shadow-2: 0 2px 8px rgba(46, 36, 112, 0.07), 0 1px 2px rgba(46, 36, 112, 0.04);
  --shadow-3: 0 14px 34px rgba(46, 36, 112, 0.16), 0 4px 10px rgba(46, 36, 112, 0.07);
  --sh-brand: 0 10px 26px rgba(106, 90, 224, .32);
  --sh-gold: 0 8px 22px rgba(245, 176, 0, .32);
  /* Bewegung */
  --ease: cubic-bezier(.22,.85,.24,1);
  --e-pop: cubic-bezier(.34,1.56,.64,1);
}

/* dark mode override */
.theme-dark {
  --bg: #0F0D24;
  --bg-2: #16133A;
  --surface: #1B1842;
  --surface-2: #232057;
  --line: #2E2A62;
  --line-2: #3D3878;
  --ink: #EEECFF;
  --ink-soft: #B4B0D8;
  --ink-mute: #807CA8;
  --accent: #8F82FF;
  --accent-soft: #2A2562;
  --brand: #8F82FF;
  --brand-2: #A99EFF;
  --brand-3: #6A5AE0;
  --brand-ink: #DAD5FF;
  --brand-soft-2: #332D72;
  --koralle: #FF8FA6;
  --koralle-2: #FFB6C8;
  --koralle-soft: #3A1E2A;
  --gold: #FFC633;
  --gold-2: #FFD86A;
  --gold-3: #D89B00;
  --gold-soft: #3A2E0E;
  --success: #3FD483;
  --success-bg: #12321F;
  --success-3: #26A85F;
  --rose: #FF6B86;
  --rose-bg: #3A1620;
  --rose-3: #C43A57;
  --sapphire: #5FA3FF;
  --sapphire-soft: #14243F;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 2px 6px rgba(0,0,0,.45), 0 10px 26px rgba(0,0,0,.3);
  --shadow-3: 0 8px 18px rgba(0,0,0,.5), 0 26px 60px rgba(0,0,0,.45);
  --sh-brand: 0 8px 24px rgba(143,130,255,.28);
  --sh-gold: 0 8px 22px rgba(255,198,51,.22);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Geist', 'Scheherazade New', ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-feature-settings: 'ss01', 'cv11';
  font-size: 14.5px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  letter-spacing: -0.011em;
}

button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea, select { font-family: inherit; color: inherit; font-size: 16px; } /* 16 px: unter 16 zoomt iOS-Safari beim Tippen in ein Feld und bleibt gezoomt (23.09.2026) */
a { color: inherit; text-decoration: none; }

/* logo wordmark */
.logo {
  font-family: 'Geist', sans-serif;
  font-weight: 700;
  font-size: 26px;
  letter-spacing: -0.045em;
  color: var(--ink);
  font-style: normal;
}

/* primary surfaces */
.app {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: 100vh;
  min-height: 100dvh; /* Safari-Browser: die sichtbare Höhe, nicht die mit eingeklappten Leisten (23.09.2026) */
  background: var(--bg);
}

/* ---------- sidebar ---------- */
.sidebar {
  border-right: 1px solid var(--line);
  background: var(--bg);
  padding: 22px 18px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.sidebar .logo { margin-left: 8px; margin-bottom: 8px; }
.nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: var(--r-md);
  color: var(--ink-soft);
  font-weight: 600;
  font-size: 14.5px;
  transition: background .15s var(--ease), color .15s var(--ease);
  text-align: left;
  width: 100%;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.nav-icon { width: 30px; height: 30px; display: grid; place-items: center; flex: 0 0 30px; }

.cta-block {
  display: flex; flex-direction: column; gap: 10px;
  margin-top: 6px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: 14px;
  border: 1px solid transparent;
  transition: transform .12s var(--ease), background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);
  user-select: none;
  letter-spacing: -0.005em;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: #2a3050; }
.btn-ghost { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { filter: brightness(1.05); }
.btn-success { background: var(--success); color: #fff; }
.btn-full { width: 100%; }
.btn-lg { padding: 13px 20px; font-size: 15px; }

.stacks {
  border-top: 1px solid var(--line);
  margin-top: 8px;
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  overflow: auto;
}
.stacks-head {
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 600; font-size: 11px; color: var(--ink-mute);
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 4px 8px 8px;
}
.stack-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border-radius: var(--r-sm);
  color: var(--ink);
  font-weight: 500;
  font-size: 13.5px;
  cursor: pointer;
  position: relative;
}
.stack-row:hover { background: var(--surface-2); }
.stack-row.is-active { background: var(--surface); box-shadow: var(--shadow-1); }
.stack-row .caret { width: 14px; color: var(--ink-mute); opacity: 0; transition: opacity .1s var(--ease); }
.stack-row.has-caret .caret { opacity: 1; }
.stack-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack-dot {
  width: 12px; height: 12px; border-radius: 4px; flex: 0 0 12px;
}

/* ---------- main / header ---------- */
.main {
  display: flex; flex-direction: column;
  min-width: 0;
}
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 32px;
  position: sticky; top: 0; z-index: 4;
  background: var(--bg);
  border-bottom: 1px solid transparent;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar .spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px;
  border-radius: var(--r-pill);
  background: var(--surface);
  border: 1px solid var(--line);
  font-weight: 500;
  font-size: 13px;
  color: var(--ink);
  transition: background .15s var(--ease), border-color .15s var(--ease);
}
.pill:hover { background: var(--surface-2); }
.pill .em { font-weight: 600; }
.icon-btn {
  width: 34px; height: 34px;
  border-radius: var(--r-pill);
  background: var(--surface);
  border: 1px solid var(--line);
  display: grid; place-items: center;
  transition: background .15s var(--ease);
}
.icon-btn:hover { background: var(--surface-2); }
.avatar-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px 4px 4px;
  border-radius: var(--r-pill);
  background: var(--surface);
  border: 1px solid var(--line);
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent-soft);
  display: grid; place-items: center;
  font-size: 18px;
  overflow: hidden;
  flex: 0 0 32px;
}
.avatar.lg { width: 56px; height: 56px; font-size: 32px; flex-basis: 56px; }
.avatar.xl { width: 88px; height: 88px; font-size: 50px; flex-basis: 88px; }

/* ---------- page scaffold ---------- */
.page {
  padding: 0 32px 64px;
  display: flex; flex-direction: column;
  gap: 24px;
  max-width: 980px;
  margin: 0 auto;
  width: 100%;
}
.page.wide { max-width: 1160px; }
.page h1 { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.028em; margin: 0; line-height: 1.1; }
.page h2 { font-weight: 600; font-size: 18px; margin: 0; letter-spacing: -0.018em; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-top: 8px;
}
.section-head .title { font-weight: 600; font-size: 15.5px; letter-spacing: -0.012em; }
.section-head .link { color: var(--ink-mute); font-weight: 500; font-size: 13px; }

/* card */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: none;
}
.card.flat { box-shadow: none; }
.card.tinted { background: var(--surface-2); }

/* ---------- home / dashboard ---------- */
.home-hero {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 12px;
}
.mascot-wrap {
  width: 220px; height: 220px;
  position: relative;
  display: grid; place-items: center;
}
.mascot-wrap .shadow {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 130px; height: 14px;
  background: radial-gradient(ellipse at center, rgba(20,25,50,0.18), rgba(20,25,50,0) 70%);
}
.hero-title {
  font-family: 'Geist', sans-serif;
  font-weight: 600;
  font-size: 30px;
  text-align: center;
  letter-spacing: -0.03em;
  margin: 12px 0 18px;
}
.search-box {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 18px 12px;
  box-shadow: none;
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-box input {
  width: 100%; border: 0; outline: none; background: transparent;
  font-size: 16px; padding: 4px 0 12px;
  font-family: inherit;
}
.search-box .row { display: flex; align-items: center; gap: 8px; }
.quick-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  width: 100%;
}
.quick-btn {
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 12px;
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
  transition: transform .12s var(--ease), background .15s var(--ease);
}
.quick-btn:hover { background: var(--surface-2); transform: translateY(-1px); }

/* jump back cards */
.jumpback-row {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 300px;
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 6px;
  scroll-snap-type: x mandatory;
}
.jumpback-row::-webkit-scrollbar { height: 0; }
.jump-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
  display: flex; align-items: center; gap: 14px;
  scroll-snap-align: start;
  transition: transform .12s var(--ease), box-shadow .15s var(--ease);
  text-align: left;
}
.jump-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }

/* --- ✅ Prüf-Modus (10.09.2026) ---------------------------------------------
   Bewusst ruhiger und größer als der Rest der App: Hier sitzen keine Kinder,
   sondern Hocas und Eltern, oft mit dem Handy in der Moschee. Eine Aufnahme
   je Bildschirm, zwei große Knöpfe, sonst nichts. */
.pf-seite { max-width: 560px; }
.pf-leiste { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 2px 2px 8px; }
.pf-balken { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-bottom: 14px; }
.pf-balken i { display: block; height: 100%; border-radius: 99px; background: var(--brand); transition: width .25s var(--ease); }
.pf-karte { padding: 20px 18px; }
.pf-kopfzeile { font-size: 19px; font-weight: 900; letter-spacing: -.02em; margin-bottom: 8px; }
.pf-text { font-size: 14px; line-height: 1.55; margin: 0 0 10px; }
.pf-lektion { font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
/* Selbst sprechen auf der Wiederholungskarte (11.09.2026, Bauplan 10).
   Grosse Flaechen: Das benutzen Sechsjaehrige mit dem Daumen auf einem
   Tablet, das flach auf dem Tisch liegt. */
.qp-sprech { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 4px 0 12px; }
.qp-sprechknopf { border: 0; border-radius: 999px; padding: 14px 28px; font-size: 17px; font-weight: 800;
  background: var(--accent); color: #fff; cursor: pointer; box-shadow: 0 6px 16px rgba(46,36,112,.18); }
.qp-sprechknopf.laeuft { background: #C0392B; animation: qpPuls 1.1s ease-in-out infinite; }
@keyframes qpPuls { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@media (prefers-reduced-motion: reduce) { .qp-sprechknopf.laeuft { animation: none; } }
.qp-sprechlauf { font-size: 13.5px; font-weight: 700; color: #C0392B; }
.qp-sprechvergleich { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.qp-sprechteil { border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 999px; padding: 11px 20px; font-size: 15px; font-weight: 700; cursor: pointer; }
.qp-sprechneu { opacity: .8; }
.qp-sprechfehler { font-size: 12.5px; color: var(--muted); text-align: center; max-width: 320px; }
/* Herkunft eines Tons (11.09.2026): Die 47 Aufnahmen aus dem Video sind
   rechnerisch zugeordnet — der Pruefer soll das sehen, bevor er urteilt. */
.pf-herkunft { margin: 6px 0 2px; padding: 8px 10px; border-radius: 10px; line-height: 1.4;
  font-size: 12.5px; font-weight: 700; background: color-mix(in srgb, var(--accent) 12%, transparent);
  color: var(--ink); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.pf-filter { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 0 2px 10px; }
.pf-filter .btn.ist-an { background: var(--accent); color: #fff; }
.pf-filter-hinweis { font-size: 12px; }
.pf-autoton { display: flex; align-items: center; gap: 8px; padding: 2px 2px 10px;
  font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
.pf-autoton input { width: 18px; height: 18px; accent-color: var(--accent); }
.pf-arabisch {
  font-family: 'Scheherazade New', 'Noto Naskh Arabic', serif;
  font-size: 46px; line-height: 1.5; text-align: center; color: var(--brand-ink);
  margin: 10px 0 2px; word-break: break-word;
}
.theme-dark .pf-arabisch { color: var(--brand-soft-2); }
.pf-lesung { text-align: center; font-size: 17px; font-weight: 800; color: var(--ink-soft); margin-bottom: 14px; }
.pf-hoeren { margin-bottom: 14px; font-size: 15.5px; font-weight: 800; }
.pf-urteil { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pf-knopf {
  border: 2px solid var(--line-2); background: var(--surface); border-radius: 14px;
  padding: 16px 10px; font-size: 15.5px; font-weight: 900; cursor: pointer; color: var(--ink);
  transition: background .12s var(--ease), border-color .12s var(--ease), color .12s var(--ease);
}
.pf-gut:hover { border-color: var(--success); color: var(--success-3); }
.pf-gut.ist-an { background: var(--success-bg); border-color: var(--success); color: var(--success-3); }
.pf-anders:hover { border-color: var(--gold); color: var(--gold-3); }
.pf-anders.ist-an { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-3); }
.pf-anders-block { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.pf-feld { display: block; margin-bottom: 12px; }
.pf-feld > span { display: block; font-size: 13px; font-weight: 800; margin-bottom: 5px; color: var(--ink-soft); }
.pf-feld input, .pf-feld textarea {
  width: 100%; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink); font-size: 16px; font-family: inherit; resize: vertical;
}
.pf-feld input:focus, .pf-feld textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
.pf-mikro { display: flex; gap: 8px; flex-wrap: wrap; }
.pf-laeuft { margin-top: 9px; font-weight: 800; font-size: 13.5px; color: var(--rose); }
.pf-fehler { margin-top: 9px; font-size: 13px; font-weight: 700; color: var(--rose-3); }
.pf-navi { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
.pf-zaehler { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pf-fuss { display: grid; gap: 9px; margin-top: 18px; }
.pf-fuss .pf-text { text-align: center; margin: 0; }
@media (max-width: 560px) {
  .pf-arabisch { font-size: 38px; }
  .pf-knopf { padding: 14px 8px; font-size: 14.5px; }
}

/* --- Weitermachen ganz oben (10.09.2026) ---------------------------------
   Die Reihe ist der erste Griff auf der Startseite. Drei Zustände:
   die Lektion, an der man gerade ist (hervorgehoben, mit Marke), die
   offenen davor und danach (normal), und die noch verschlossenen (blass,
   nicht anklickbar). Die Karten sind schmaler als früher — es sollen
   mehrere gleichzeitig zu sehen sein, damit man den Verlauf erfasst. */
.weiter-kopf { margin: 2px 0 10px; }
/* padding-top, weil overflow-x:auto auch oben abschneidet — die Marke
   „Du bist hier" ragt über den Kartenrand hinaus und wäre sonst weg. */
.weiter-reihe { grid-auto-columns: 268px; padding-top: 11px; }
.jump-card { position: relative; }
.jump-name { font-weight: 800; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jump-sub { font-size: 12.5px; line-height: 1.35; }
.jump-card.ist-dran {
  border-color: var(--brand);
  box-shadow: 0 0 0 2px var(--brand-soft-2), var(--shadow-2);
}
.jump-marke {
  position: absolute; top: -9px; right: 12px;
  background: var(--brand); color: var(--auf-akzent, #fff);
  font-size: 11px; font-weight: 900; letter-spacing: .02em;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap;
}
.jump-card.ist-zu { opacity: .55; cursor: default; }
.jump-card.ist-zu:hover { transform: none; box-shadow: none; }
.ring-zu { display: grid; place-items: center; }
.ring-zu .label { font-size: 20px; }

/* Sprachwahl auf der Startseite */
.sprach-pillen { display: flex; gap: 6px; margin-top: 8px; }
.sprach-pille {
  border: 1px solid var(--line-2); background: var(--surface);
  color: var(--ink-soft); font-weight: 800; font-size: 12.5px;
  padding: 4px 11px; border-radius: 999px; cursor: pointer;
  transition: background .12s var(--ease), color .12s var(--ease), border-color .12s var(--ease);
}
.sprach-pille:hover { border-color: var(--brand); color: var(--brand); }
.sprach-pille.ist-an { background: var(--brand); border-color: var(--brand); color: var(--auf-akzent, #fff); }
.sprach-pillen.ist-kompakt { gap: 4px; margin: 0; flex: 0 0 auto; }
.sprach-pillen.ist-kompakt .sprach-pille { padding: 5px 9px; font-size: 12px; letter-spacing: .04em; }

@media (max-width: 560px) {
  .weiter-reihe { grid-auto-columns: 236px; }
  .jump-name { font-size: 14.5px; }
}

.ring {
  width: 56px; height: 56px;
  flex: 0 0 56px;
  position: relative;
  display: grid; place-items: center;
}
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .ring-bg { stroke: var(--line); }
.ring .ring-fg { stroke: var(--success); }
.ring .label {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-weight: 800; font-size: 13px;
}

.friends-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.friend-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
}
.friend-card .meta { flex: 1; min-width: 0; }
.friend-card .name { font-weight: 600; }
.friend-card .sub { color: var(--ink-mute); font-size: 13px; }

/* ---------- fortschritt ---------- */
.level-card {
  display: flex; align-items: center; gap: 18px;
  padding: 16px 20px;
}
.level-shield {
  width: 70px; height: 70px; flex: 0 0 70px;
  background: linear-gradient(180deg, var(--line-2), #8A99BB);
  border-radius: 16px;
  display: grid; place-items: center;
  color: #fff; font-weight: 900;
  font-size: 13px;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.06);
  position: relative;
}
.level-shield::before {
  content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  font-size: 28px;
}
.xp-bar {
  flex: 1;
  height: 10px;
  background: var(--bg-2);
  border-radius: var(--r-pill);
  overflow: hidden;
  margin-top: 8px;
}
.xp-bar .fill {
  height: 100%;
  background: linear-gradient(90deg, var(--success), #5BC787);
  border-radius: inherit;
  position: relative;
}
.xp-pill {
  background: var(--success-bg); color: var(--success);
  font-weight: 800; font-size: 12px;
  padding: 4px 10px; border-radius: var(--r-pill);
  display: inline-flex; align-items: center; gap: 4px;
}

.streak-card { padding: 22px 24px; }
.streak-head { display: flex; align-items: center; justify-content: space-between; }
.streak-head h2 { font-family: 'Geist', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.022em; }
.gem-card {
  width: 160px; height: 110px;
  background: linear-gradient(135deg, #FFC25C, #E07A2E);
  border-radius: var(--r-lg);
  display: grid; place-items: center;
  color: #fff; font-weight: 900;
  position: relative; overflow: hidden;
  margin-right: -6px;
}
.gem-card.next { background: linear-gradient(135deg, #88D6F7, #4D8BC9); }
.gem-card .gem-label { position: absolute; bottom: 8px; left: 12px; font-size: 13px; }
.week-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 4px; margin-top: 16px;
}
.day-cell {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 6px 0;
  color: var(--ink-mute);
  font-weight: 700; font-size: 13px;
}
.day-cell .glyph {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 13px;
  color: var(--ink-soft);
}
.day-cell.done .glyph { background: transparent; }
.day-cell.future .glyph { color: var(--ink-mute); }
.day-band {
  grid-column: span 5;
  background: linear-gradient(90deg, var(--accent-soft), var(--accent-soft));
  margin: 0 0;
  border-radius: var(--r-pill);
  height: 38px;
  position: relative;
}

/* ---------- decks grid ---------- */
.deck-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.deck-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
  display: flex; flex-direction: column; gap: 14px;
  cursor: pointer;
  transition: transform .12s var(--ease), box-shadow .15s var(--ease);
  text-align: left;
  min-height: 150px;
  position: relative;
  overflow: hidden;
}
.deck-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.deck-card .swatch {
  width: 40px; height: 40px;
  border-radius: 10px;
}
.deck-card .deck-name { font-weight: 600; font-size: 15.5px; line-height: 1.25; letter-spacing: -0.012em; }
.deck-card .deck-meta { color: var(--ink-mute); font-size: 13px; font-weight: 500; }

/* deck detail */
.deck-head {
  display: flex; align-items: center; gap: 14px;
}
.deck-head .swatch-lg {
  width: 40px; height: 40px; border-radius: 10px;
}
.deck-head h1 { font-size: 22px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 640px) {
  /* (23.09.2026) „Kuran verstehen 5 – Der Kuran…" — auf dem Handy lieber zwei Zeilen. */
  .deck-head h1 { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 19px; line-height: 1.2; }
}
.tabs {
  display: flex; gap: 24px;
  border-bottom: 1px solid var(--line);
  padding: 4px 0;
}
.tab {
  padding: 10px 0;
  font-weight: 500; font-size: 14px;
  color: var(--ink-mute);
  border-bottom: 1.5px solid transparent;
  margin-bottom: -1px;
  transition: color .15s var(--ease), border-color .15s var(--ease);
  letter-spacing: -0.005em;
}
.tab.is-active { font-weight: 600; }
.tab.is-active { color: var(--ink); border-bottom-color: var(--ink); }
.tab:hover { color: var(--ink); }

.flashcard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  display: flex; flex-direction: column;
  gap: 12px;
}
.flashcard .q { font-weight: 600; font-size: 15px; letter-spacing: -0.012em; }
.flashcard .a { color: var(--ink-soft); font-size: 14px; }
.mark { color: var(--success); background: var(--success-bg); padding: 0 4px; border-radius: 5px; font-weight: 700; }

.import-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
}
.import-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  font-weight: 700; font-size: 14px;
  transition: transform .12s var(--ease), box-shadow .15s var(--ease);
  cursor: pointer;
}
.import-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.import-card.is-disabled { opacity: 0.45; cursor: default; }
.import-card.is-disabled:hover { transform: none; box-shadow: none; }

/* ---------- modal ---------- */
.scrim {
  position: fixed; inset: 0;
  background: rgba(15, 19, 34, 0.42);
  backdrop-filter: blur(2px);
  display: grid; place-items: center;
  z-index: 50;
  padding: 40px;
  animation: fadeIn .15s var(--ease);
}
.modal {
  background: var(--surface);
  border-radius: var(--r-xl);
  width: 100%;
  max-width: 760px;
  max-height: 88vh;
  box-shadow: var(--shadow-3);
  overflow: hidden;
  display: flex; flex-direction: column;
  animation: pop .2s var(--ease);
}
.modal .modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
}
.modal .modal-head .ttl { font-weight: 800; font-size: 17px; flex: 1; text-align: center; }
.modal .modal-body { padding: 22px; overflow: auto; flex: 1; }
.modal .modal-foot { padding: 16px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.close-btn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.close-btn:hover { background: var(--surface-2); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.mode-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
}
.mode-card {
  border: 1.5px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px 14px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  cursor: pointer;
  background: var(--surface);
  transition: transform .12s var(--ease), border-color .15s var(--ease), background .15s var(--ease);
}
.mode-card:hover { transform: translateY(-2px); border-color: var(--ink-mute); }
.mode-card.is-selected { border-color: var(--success); background: var(--success-bg); border-width: 2px; }
.mode-card .mode-ttl { font-weight: 600; font-size: 15px; letter-spacing: -0.012em; }
.mode-card .mode-sub { color: var(--ink-mute); font-size: 13px; text-align: center; }

/* ---------- quiz ---------- */
.quiz-shell {
  min-height: 100vh;
  background: var(--bg);
  display: flex; flex-direction: column;
}
.quiz-progress {
  height: 14px;
  background: var(--bg-2);
}
.quiz-progress .bar {
  height: 100%; background: linear-gradient(90deg, var(--accent), #A0A0FB);
  border-radius: 0 var(--r-pill) var(--r-pill) 0;
  transition: width .45s var(--ease);
}
.quiz-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px;
}
.quiz-stack {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800;
}
.quiz-stage {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 20px 24px 48px;

  animation-duration: 1.65s;
}
/* ============================================================
   "Stapel gemeistert"-Feier — Neufassung 26.07.2026.

   Nutzerkritik zur alten Fassung: "der Effekt, wenn ich etwas
   durchgespielt habe, ist nicht so geil wie bei dem echten Gizmo."
   Die alte Version war ein Pop + drei Ringe in 4,6 s. Jetzt eine
   gestaffelte Bühnen-Feier über 6,2 s:
     0,00 s  Abdunkeln + Strahlenkranz startet zu drehen
     0,05 s  vier Ringe brechen nach außen aus (statt drei)
     0,10 s  Karte springt herein (Overshoot), Glanz-Sweep läuft durch
     0,25 s  Pokal springt, pulsierender Goldschein dahinter
     0,45 s  Titel fährt von unten ein
     0,65 s  Untertitel fährt ein
     0,85 s  goldenes "100 %"-Abzeichen ploppt
     +Konfetti in drei Salven aus app/celebrate.js
   ============================================================ */
.mastered-overlay {
  position: fixed; inset: 0; z-index: 70; pointer-events: none;
  display: grid; place-items: center;
  background:
    radial-gradient(circle at 50% 44%, rgba(246,196,69,.30), rgba(0,0,0,0) 58%),
    rgba(14,12,28,.42);
  animation: masteredFade 6.2s ease forwards;
}
/* Rotierender Strahlenkranz hinter der Karte (Gizmo-typischer "Sunburst"). */
.mastered-overlay::before {
  content: ''; position: absolute; left: 50%; top: 46%;
  width: 150vmax; height: 150vmax; transform: translate(-50%, -50%);
  background: repeating-conic-gradient(from 0deg,
    rgba(255,255,255,.16) 0deg 7deg, rgba(255,255,255,0) 7deg 16deg);
  animation: rayspin 14s linear infinite, rayFade 6.2s ease forwards;
}
.mastered-card {
  position: relative; text-align: center; overflow: hidden;
  animation: masteredPop .72s cubic-bezier(.18,1.7,.36,1) .1s both;
  background: var(--surface, #fff); border-radius: 30px; padding: 38px 34px;
  /* Auf schmalen Handys nicht bis an den Rand laufen (die Karte skaliert beim
     Pop über 1.06 hinaus — ohne Rand würde das abgeschnitten wirken). */
  max-width: min(420px, calc(100vw - 44px)); box-sizing: border-box;
  box-shadow: 0 30px 90px rgba(0,0,0,.38), 0 0 0 1.5px rgba(246,196,69,.45),
              0 0 70px rgba(246,196,69,.35);
}
/* Glanz-Sweep: einmal quer über die Karte, wie ein Lichtreflex. */
.mastered-card::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 55%;
  background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0));
  animation: cardShine 1.15s ease-out .5s both; pointer-events: none;
}
.mastered-trophy {
  font-size: 86px; display: inline-block; position: relative;
  animation: trophyBounce 1.3s cubic-bezier(.2,1.5,.3,1) .25s, trophyGlow 1.9s ease-in-out .3s 2;
  filter: drop-shadow(0 8px 18px rgba(246,196,69,.6));
}
.mastered-title {
  font-family: Fraunces, serif; font-weight: 900; font-size: 33px; margin-top: 6px;
  animation: masteredSlideUp .5s cubic-bezier(.2,1.3,.3,1) .45s both;
}
.mastered-sub {
  color: var(--ink-mute, #888); margin-top: 6px; font-weight: 600;
  animation: masteredSlideUp .5s cubic-bezier(.2,1.3,.3,1) .65s both;
}
/* Goldenes Abzeichen unter dem Untertitel ("100 % gemeistert"). */
.mastered-badge {
  display: inline-block; margin-top: 14px; padding: 7px 16px; border-radius: 999px;
  font-weight: 900; font-size: 13.5px; letter-spacing: .3px; color: #7A5B00;
  background: linear-gradient(135deg, #FFE9A8, var(--gold-2) 60%, #FFB020);
  box-shadow: 0 6px 18px rgba(246,196,69,.5), inset 0 1px 0 rgba(255,255,255,.7);
  animation: badgePop .55s cubic-bezier(.2,1.8,.3,1) .85s both;
}
.mastered-ring {
  position: absolute; left: 50%; top: 46%; width: 130px; height: 130px;
  border: 5px solid rgba(246,196,69,.85); border-radius: 50%;
  transform: translate(-50%, -50%); animation: ringBurst 1.35s ease-out .05s forwards;
}
.mastered-ring.r2 { animation-delay: .25s; border-color: rgba(14, 107, 87,.7); }
.mastered-ring.r3 { animation-delay: .45s; border-color: rgba(52,199,89,.65); }
.mastered-ring.r4 { animation-delay: .68s; border-color: rgba(255,255,255,.6); border-width: 3px; }
@keyframes masteredPop {
  0%   { transform: scale(.42) rotate(-6deg); opacity: 0; }
  62%  { transform: scale(1.06) rotate(1.5deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
@keyframes masteredSlideUp {
  from { transform: translateY(16px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
@keyframes badgePop {
  0%   { transform: scale(.4); opacity: 0; }
  70%  { transform: scale(1.14); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes cardShine {
  from { left: -60%; }
  to   { left: 115%; }
}
@keyframes trophyBounce {
  0%   { transform: translateY(0) scale(1); }
  22%  { transform: translateY(-30px) scale(1.16) rotate(-9deg); }
  46%  { transform: translateY(0) scale(.96); }
  64%  { transform: translateY(-13px) scale(1.06) rotate(6deg); }
  82%  { transform: translateY(0) scale(.99); }
  92%  { transform: translateY(-4px); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes trophyGlow {
  0%, 100% { filter: drop-shadow(0 8px 18px rgba(246,196,69,.45)); }
  50%      { filter: drop-shadow(0 8px 30px rgba(246,196,69,1)); }
}
@keyframes ringBurst {
  from { transform: translate(-50%, -50%) scale(.35); opacity: 1; }
  to   { transform: translate(-50%, -50%) scale(4.4); opacity: 0; }
}
@keyframes rayspin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to   { transform: translate(-50%, -50%) rotate(360deg); }
}
@keyframes rayFade {
  0% { opacity: 0; } 12% { opacity: .55; } 70% { opacity: .35; } 100% { opacity: 0; }
}
@keyframes masteredFade {
  0% { opacity: 0; } 6%, 84% { opacity: 1; }
  100% { opacity: 0; }
}

/* ---- Konfetti-Explosion (app/celebrate.js erzeugt die Knoten, hier die Physik).
   Eigene Klassennamen (.confetti-burst-*) — .confetti-piece ist schon vom
   fallenden Rundenende-Konfetti belegt und darf nicht überschrieben werden. ---- */
.confetti-burst-layer {
  position: fixed; inset: 0; z-index: 78; pointer-events: none; overflow: hidden;
  --origin-top: 44%;
}
.confetti-bit {
  position: absolute; left: 50%; top: var(--origin-top);
  width: var(--size, 9px); height: var(--size, 9px);
  will-change: transform, opacity;
  animation: confettiBurst var(--dur, 2s) cubic-bezier(.18,.62,.3,1) var(--delay, 0s) both;
}
.confetti-bit.cf-rect { height: calc(var(--size, 9px) * 0.45); border-radius: 1.5px; }
.confetti-bit.cf-sq { border-radius: 2px; }
.confetti-bit.cf-circle { border-radius: 50%; }
.confetti-bit.cf-star {
  background: none !important; width: auto; height: auto;
  font-size: calc(var(--size, 9px) * 1.9); line-height: 1; font-weight: 900;
}
@keyframes confettiBurst {
  0%   { transform: translate(-50%, -50%) scale(.3) rotate(0deg); opacity: 0; }
  8%   { opacity: 1; }
  38%  { transform: translate(calc(-50% + var(--dx) * .82), calc(-50% + var(--dy))) scale(1) rotate(calc(var(--rot) * .45)); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 68vh)) scale(.85) rotate(var(--rot)); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .mastered-overlay::before, .mastered-card::after { animation: none; opacity: 0; }
  .mastered-trophy { animation: none; }
}

   `min-height` heisst: mindestens so hoch — waechst der Inhalt, waechst die
   Huelle mit. Genau das geschah: Die Huelle wurde 873 Punkte hoch, wo das
   Fenster 852 hat, und die Fragekarte gab ihre 21 ueberzaehligen Punkte nie
   her, weil ihr niemand den Platz streitig machte. `height` macht den Rahmen
   fest — jetzt muessen sich die Kinder darin einrichten, und die Karte raeumt
   das Feld fuer die Antworten.

   Sollte es doch einmal nicht reichen (sehr kleines Geraet, sehr lange
   Antworten), scrollt NUR die Buehne. Die Kopfzeile bleibt dann stehen, statt
   unter die Statusleiste des Telefons zu rutschen — Nuris zweite Beschwerde
   vom selben Tag. */
.quiz-shell.qp-skin { height: 100dvh; box-sizing: border-box; }
/* `min-height: 0` ist der Schluessel: Ein Flex-Kind schrumpft NICHT unter die
   Groesse seines Inhalts, solange `min-height: auto` gilt — es waechst
   stattdessen ueber den Rand hinaus. Genau deshalb half es nicht, der
   Fragekarte das Wachsen zu erlauben: Der Platz, den sie haette hergeben
   koennen, wurde ihr nie streitig gemacht. Mit dieser Zeile gibt die Buehne
   den Druck weiter, und die Karte raeumt das Feld. (14.09.2026) */
.qp-skin .quiz-stage { align-items: stretch; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
.qp-skin .quiz-stage .stage-inner { flex: 1 1 auto; min-height: 0; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }
.qp-skin .qp-gatespacer { flex: 1 1 24px; height: auto; min-height: 10px; }

/* DIE KARTE NIMMT, WAS UEBRIG BLEIBT — SIE FORDERT NICHTS. (14.09.2026)

   Hier stand `min-height: clamp(220px, 42dvh, 430px)` fuer Handys, mit der
   guten Absicht: Bei zwei, drei Antworten sah die Karte sonst verloren aus.
   Nur ist 42dvh eine FORDERUNG. Auf einem iPhone (393x852) sind das 358
   Punkte allein fuer die Frage — und wenn darunter fuenf arabische
   Antwortknoepfe stehen, reicht der Bildschirm nicht mehr.

   Nuri mit zwei Bildschirmfotos, 14.09.: Die letzte Antwort lag unterhalb des
   Randes; man musste scrollen, um sie zu sehen, und beim Scrollen rutschte die
   Kopfzeile unter die Statusleiste des Telefons. Nachgemessen mit der
   Proberunde in Handy-Groesse: JEDE Karte stand 313 bis 337 Punkte ueber.

   Jetzt waechst die Karte ueber `flex`, statt eine Hoehe zu verlangen: Ist
   Platz da, fuellt sie ihn; brauchen die Antworten ihn, gibt sie ihn her. Das
   erhaelt die urspruengliche Absicht und nimmt ihr die Schaerfe. */
.qp-skin .qp-card { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.qp-skin .qp-cardbody { flex: 1 1 auto; min-height: clamp(120px, 18dvh, 260px); }
@media (max-width: 640px) {
  .qp-skin .qp-cardbody { min-height: clamp(110px, 15dvh, 220px); }
}

/* Wird es eng — kleines Telefon, fuenf arabische Antworten —, ruecken die
   Knoepfe zusammen, statt aus dem Bild zu laufen. Die Zeilenhoehe bleibt
   grosszuegig genug fuer die Harekat ueber und unter dem Buchstaben. */
@media (max-height: 1000px) {
  .qp-skin .quiz-stage .stage-inner { gap: 10px; }
  .qp-skin .options { gap: 8px; }
  .qp-skin .option { padding: 11px 14px; }
  .qp-skin .option.option-arabic { font-size: 30px; line-height: 1.5; }
  .qp-skin .qp-cardbody { padding: 14px 16px; }
  .qp-skin .qp-cardbody .qtext-arabic { font-size: clamp(40px, 13vw, 54px); line-height: 1.5; }
}
.quiz-stack { min-width: 0; flex: 1 1 auto; }
.quiz-stack-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.quiz-toprow { flex: 0 0 auto; }
@media (max-width: 640px) {
  .hide-sm { display: none !important; }
  .quiz-topbar { padding: 10px 10px; gap: 8px; }
  .quiz-topbar .icon-btn { flex: 0 0 40px; width: 40px; height: 40px; } /* Tippfläche für Kinderfinger (23.09.2026) */
  .quiz-stack { font-size: 13.5px; gap: 6px; }
  .quiz-toprow { gap: 5px !important; }
  .quiz-topbar .pill { padding: 4px 9px; font-size: 12px; }
  .qp-skin .quiz-stage { padding: 12px 12px calc(14px + env(safe-area-inset-bottom)); }
  .qp-skin .qp-cardbody .qtext-arabic { font-size: clamp(44px, 15vw, 62px); line-height: 1.6; }
  /* (23.09.2026) Ganze Sätze (Stufe 4/5, Gebete) nicht in Buchstaben-Größe: ein 45-Zeichen-Satz
     wurde 4 Zeilen à 54 px hoch, kein Kind sah eine Antwort ohne zu scrollen. */
  .qp-skin .qp-cardbody .qtext-arabic.ist-satz { font-size: clamp(26px, 7.5vw, 34px); line-height: 1.85; }
}
@media (min-width: 641px) { .hide-sm { display: initial; } }
/* Statusleiste (installierte App): navy Fläche hinter der Notch statt Inhalt darunter */
.qp-skin .quiz-progress { margin-top: 0; }
header.topbar { padding-top: max(12px, env(safe-area-inset-top)); }

/* ---- Lehrkarte "Neuer Buchstabe!" (Teach-first, 06.08.2026) ---- */
.qp-teachbox { margin-top: 14px; background: #fff; border-radius: 12px; padding: 16px 14px; text-align: center; box-shadow: 0 3px 14px rgba(46,36,112,.14); display: grid; gap: 8px; justify-items: center; animation: teachPop .35s cubic-bezier(.2,.9,.3,1.15); }
@keyframes teachPop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.qp-teachtitle { display: inline-block; background: var(--success-bg); color: var(--success-3); font-weight: 800; font-size: 13px; padding: 4px 12px; border-radius: 999px; }
.qp-teachname { font-weight: 900; font-size: 26px; color: var(--brand); letter-spacing: .01em; }
.qp-teachspk { border: none; background: var(--brand); color: #fff; font-family: inherit; font-weight: 900; font-size: 15px; border-radius: 999px; padding: 12px 22px; cursor: pointer;
  box-shadow: 0 4px 0 var(--brand-3, #4b3fb0); transition: transform .08s; }

.qp-teachspk:active { transform: translateY(4px); box-shadow: none; }

/* Rundenende: Fußleiste über der Home-Geste, Inhalt nicht abgeschnitten */
.roundend .quiz-stage { padding-bottom: 130px; }

/* ==================================================================
   DESIGN v2 (06.08.2026, Nutzerkritik "noch nicht modern genug"):
   weiche Karten mit großem Radius statt harter Rahmen, echte Tiefe
   über Schatten, Verläufe auf allen Buttons, sanfte Eintritts-
   Animationen, dezente Sterne im Himmel-Verlauf. Reines CSS-Override
   über den bestehenden qp-Klassen — Mechanik und Wortlaut unverändert.
   ================================================================== */
/* Hintergrund: satterer Verlauf + schwebende Lichtpunkte */
.quiz-shell.qp-skin { background: linear-gradient(176deg, #6FA9DE 0%, #8FC2F5 55%, var(--bg) 100%); position: relative; }
.quiz-shell.qp-skin::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(3px 3px at 12% 22%, rgba(255,255,255,.8), transparent 60%),
    radial-gradient(2px 2px at 78% 14%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(2.5px 2.5px at 88% 42%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(2px 2px at 26% 64%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(3px 3px at 64% 78%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(220px 220px at 85% 8%, rgba(255,255,255,.16), transparent 70%),
    radial-gradient(300px 300px at 8% 90%, rgba(255,255,255,.12), transparent 70%);
}
.qp-skin .quiz-topbar, .qp-skin .quiz-stage { position: relative; z-index: 1; }
/* Topbar: abgerundete Unterkante + weicher Schatten, Pills glasig */
.qp-skin .quiz-topbar { border-radius: 0 0 20px 20px; box-shadow: 0 8px 24px rgba(46,36,112,.22); }
.qp-skin .quiz-topbar .pill { background: rgba(255,255,255,.16); backdrop-filter: blur(4px); border-radius: 999px; }
/* Fortschrittslinie: dickere Pille mit Glow */
.qp-skin .quiz-progress { height: 7px; background: rgba(255,255,255,.3); }
.qp-skin .quiz-progress .bar { background: linear-gradient(90deg, var(--success), var(--success)); border-radius: 999px; box-shadow: 0 0 10px rgba(63,191,110,.65); }
/* Lernkarte: ein weicher Block — Label sanfter Verlauf, Körper randlos, große Radien */
.qp-skin .qp-card { filter: drop-shadow(0 14px 28px rgba(46,36,112,.20)); animation: qpCardIn .34s cubic-bezier(.2,.85,.3,1.08); }
@keyframes qpCardIn { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.qp-skin .qp-cardlabel { background: linear-gradient(135deg, var(--brand-2), var(--brand-3)); border-radius: 18px 18px 0 0; padding: 10px 16px; }
.qp-skin .qp-cardbody { border: none; border-radius: 0 0 18px 18px; box-shadow: inset 0 1px 0 rgba(46,36,112,.06); }
.qp-skin .qp-answrap { filter: drop-shadow(0 10px 22px rgba(46,36,112,.16)); animation: qpUp .3s cubic-bezier(.2,.85,.3,1.06); }
@keyframes qpUp { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.qp-skin .qp-answrap .qp-cardlabel-slim { background: linear-gradient(135deg, var(--brand-2), var(--brand-3)); border-radius: 16px 16px 0 0; }
.qp-skin .qp-ansfield { border: none; border-radius: 0 0 16px 16px; padding: 16px; font-size: 19px; }
/* Hinweisbox: klarer, ohne Kursiv-Gedränge */
.qp-skin .qp-hintbox { font-style: normal; color: #2E5573; border-radius: 14px; padding: 12px 16px; font-size: 13.5px; line-height: 1.5; box-shadow: 0 6px 18px rgba(46,36,112,.14); }
/* Buttons: Verlauf, Tiefe, Anheben beim Hover, Eindrücken beim Klick */
.qp-skin .qp-btn { border-radius: 16px; padding: 15px 16px; font-size: 14.5px; letter-spacing: .05em;
  background: linear-gradient(180deg, var(--brand-2), #0F3757); box-shadow: 0 8px 18px rgba(46,36,112,.35), inset 0 1px 0 rgba(255,255,255,.14);
  transition: transform .12s, box-shadow .12s, filter .12s; }
.qp-skin .qp-btn:hover { transform: translateY(-1px); box-shadow: 0 11px 22px rgba(46,36,112,.4), inset 0 1px 0 rgba(255,255,255,.14); }
.qp-skin .qp-btn:active { transform: translateY(1px) scale(.99); box-shadow: 0 4px 10px rgba(46,36,112,.3); }
.qp-skin .qp-btn-red { background: linear-gradient(180deg, #FF4D6E, #E01C43); box-shadow: 0 8px 18px rgba(240,32,72,.35), inset 0 1px 0 rgba(255,255,255,.18); }
.qp-skin .qp-btn-red:hover { box-shadow: 0 11px 22px rgba(240,32,72,.42), inset 0 1px 0 rgba(255,255,255,.18); }
/* JA / VAGE / NEIN: runde, tiefe, farbige Tasten */
.qp-skin .qp-raterow { gap: 12px; animation: qpUp .3s cubic-bezier(.2,.85,.3,1.06); }
.qp-skin .qp-rate { border-radius: 16px; padding: 16px 8px; font-size: 15px; transition: transform .12s, box-shadow .12s, filter .12s; }
.qp-skin .qp-rate-ja { background: linear-gradient(180deg, #63C687, #43A366); box-shadow: 0 8px 18px rgba(87,184,120,.4), inset 0 1px 0 rgba(255,255,255,.25); }
.qp-skin .qp-rate-vage { background: linear-gradient(180deg, #F6CF57, #E4B32A); box-shadow: 0 8px 18px rgba(240,195,60,.4), inset 0 1px 0 rgba(255,255,255,.35); }
.qp-skin .qp-rate-nein { background: linear-gradient(180deg, #FF4D6E, #E01C43); box-shadow: 0 8px 18px rgba(240,32,72,.35), inset 0 1px 0 rgba(255,255,255,.2); }
.qp-skin .qp-rate:hover { transform: translateY(-2px); }
.qp-skin .qp-rate:active { transform: translateY(1px) scale(.97); }
/* MC-Optionen & Schrift-Kacheln im Skin: weiße Karten mit Tiefe */
.qp-skin .options .option { border: none; border-radius: 16px; box-shadow: 0 6px 16px rgba(46,36,112,.14); transition: transform .12s, box-shadow .12s; }
.qp-skin .options .option:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(46,36,112,.2); }
.qp-skin .script-row .option { border-radius: 16px; box-shadow: 0 6px 16px rgba(46,36,112,.14); }
.qp-skin .spk-btn { border-radius: 16px; transition: transform .12s, filter .12s; }
.qp-skin .spk-btn:hover { transform: translateY(-2px); }
.qp-skin .qp-formhead { background: linear-gradient(135deg, var(--brand-2), var(--brand-3)); border-radius: 16px 16px 0 0; }
.qp-skin .qp-formbody, .qp-skin .qp-tilebox { border: none; border-radius: 0 0 16px 16px; box-shadow: 0 10px 22px rgba(46,36,112,.14); }
.qp-skin .qp-tile { border-radius: 10px; box-shadow: 0 2px 6px rgba(46,36,112,.10); }
.qp-skin .qp-teachbox { border-radius: 18px; box-shadow: 0 12px 26px rgba(46,36,112,.18); }
.qp-skin .qp-teachname { font-size: 30px; }
/* Blitz/Badges im Label */
.qp-skin .qp-cardlabel .qtag { backdrop-filter: blur(3px); }
/* Rundenende: weichere Karte + größerer Ring-Look */
.roundend .card { border-radius: 20px; box-shadow: 0 14px 32px rgba(46,36,112,.10); border: none; }
.roundend-title { letter-spacing: -0.01em; }

/* ==================================================================
   HAUPT-TOPBAR MOBIL (06.08.2026, Screenshot: "Anmelden oben abge-
   schnitten"): großzügige safe-area, kein Herausragen, weniger
   Elemente — Geschichte/Freunde-Pills verschwinden auf schmalen
   Screens (Funktionen bleiben über Profil/Modals erreichbar), der
   Konto-Chip/Anmelden-Button bleibt IMMER sichtbar und frei.
   ================================================================== */
@media (max-width: 820px) {
  header.topbar { padding: calc(10px + env(safe-area-inset-top)) 12px 10px !important; overflow: visible; }
  header.topbar .pill.tb-hide { display: none; }
  header.topbar .btn { padding: 9px 16px !important; }
  /* (23.09.2026) Der Namens-Chip darf schrumpfen und mit „…" enden — vorher
     flex-shrink: 0, und ein langer Name schob die Seite seitlich hinaus. */
  header.topbar .pill { flex-shrink: 1; min-width: 0; max-width: 52vw; }
  header.topbar .pill .tb-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
/* Bottom-Navigation: sanfter Blur-Look */
.mobilenav { backdrop-filter: blur(10px); background: rgba(255,255,255,.92); }

/* ==================================================================
   📲 INSTALL-BANNER (Startseite, nur mobil & nicht installiert)
   ================================================================== */
.install-banner { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 14px 16px;
  border-radius: 18px; background: linear-gradient(135deg, var(--brand), #17588A); color: #fff;
  box-shadow: 0 10px 26px rgba(46,36,112,.3); }
.install-banner .ib-emoji { font-size: 30px; }
.install-banner .ib-txt { flex: 1; min-width: 0; }
.install-banner .ib-title { font-weight: 800; font-size: 15px; }
.install-banner .ib-sub { font-size: 12.5px; opacity: .85; margin-top: 2px; line-height: 1.4; }
.install-banner .ib-btn { border: none; border-radius: 12px; padding: 10px 14px; font: inherit; font-weight: 800;
  background: #fff; color: var(--brand); cursor: pointer; white-space: nowrap; }
.install-banner .ib-close { border: none; background: transparent; color: rgba(255,255,255,.7); font-size: 18px; cursor: pointer; padding: 4px; }
.install-steps { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.12); font-size: 12.5px; line-height: 1.55; }

/* ==================================================================
   ANTWORT-AUSWAHL v3 (06.08.2026, Nutzerwunsch "die Auswahl unten
   besser machen, neu designen, besser zum Lernen"):
   große mittige Tasten mit Tiefe, gestaffeltes Einblenden, klares
   ✓/✕-Feedback direkt auf der Taste, Wackeln bei falsch — und der
   ganze Spielbereich sitzt vertikal mittig statt oben angeklebt.
   ================================================================== */
/* MC-/Lückentext-Karten (haben .options, aber keinen Füll-Spacer): mittig ausbalancieren */
.qp-skin .stage-inner:has(.options) { justify-content: center; }
.qp-skin .stage-inner:has(.script-row) { justify-content: center; }
.qp-skin .options { gap: 11px; margin-top: 6px; }
.qp-skin .options .option {
  position: relative; border: none; border-radius: 16px; padding: 16px 48px;
  font-weight: 700; font-size: 16px; color: var(--ink); text-align: center; justify-content: center;
  background: #fff; box-shadow: 0 5px 14px rgba(46,36,112,.13);
  transition: transform .12s, box-shadow .12s, background .15s;
  animation: qpOptIn .32s cubic-bezier(.2,.85,.3,1.05) both;
}
.qp-skin .options .option:nth-child(2) { animation-delay: .05s; }
.qp-skin .options .option:nth-child(3) { animation-delay: .10s; }
.qp-skin .options .option:nth-child(4) { animation-delay: .15s; }
.qp-skin .options .option:nth-child(5) { animation-delay: .20s; }
@keyframes qpOptIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.qp-skin .options .option:hover:not(.is-disabled):not(.is-correct):not(.is-wrong) { transform: translateY(-2px); background: #fff; box-shadow: 0 9px 20px rgba(46,36,112,.19); }
.qp-skin .options .option:active { transform: scale(.985); }
.qp-skin .options .option.is-correct {
  background: linear-gradient(180deg, var(--success-bg), var(--success-bg)); color: var(--success-3);
  box-shadow: inset 0 0 0 2.5px var(--success), 0 8px 20px rgba(46,196,160,.28);
}
.qp-skin .options .option.is-correct::after {
  content: '✓'; position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%; background: var(--success); color: #fff;
  font-size: 15px; font-weight: 900; display: grid; place-items: center; line-height: 1;
  animation: qpBadgePop .3s cubic-bezier(.2,1.6,.4,1);
}
.qp-skin .options .option.is-wrong {
  background: linear-gradient(180deg, #FEECEF, #FBDCE2); color: #C21A3F;
  box-shadow: inset 0 0 0 2.5px var(--rose), 0 8px 20px rgba(240,32,72,.2);
}
.qp-skin .options .option.is-wrong::after {
  content: '✕'; position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%; background: var(--rose); color: #fff;
  font-size: 14px; font-weight: 900; display: grid; place-items: center; line-height: 1;
}
@keyframes qpBadgePop { from { transform: translateY(-50%) scale(0); } to { transform: translateY(-50%) scale(1); } }
.qp-skin .options .option.is-disabled { opacity: .5; }
.qp-skin .options .option.option-arabic { font-size: 34px; line-height: 1.85; padding: 10px 48px; }
@media (max-width: 640px) {
  .qp-skin .options .option { padding: 15px 44px; font-size: 15.5px; min-height: 54px; }
  .qp-skin .options .option.option-arabic { font-size: 31px; }
  /* Karte etwas kompakter, wenn Antworten drunter stehen — bessere Balance */
  .qp-skin .stage-inner:has(.options) .qp-cardbody { min-height: clamp(170px, 30dvh, 300px); }
}
/* JA / VAGE / NEIN: kleine Symbole über dem Wort — schneller erfassbar für Kinder */
.qp-skin .qp-rate { display: grid; justify-items: center; gap: 2px; line-height: 1.15; }
.qp-skin .qp-rate::before { font-size: 17px; font-weight: 900; }
.qp-skin .qp-rate-ja::before { content: '✓'; }
.qp-skin .qp-rate-vage::before { content: '🤔'; font-size: 16px; }
.qp-skin .qp-rate-nein::before { content: '✕'; }
/* Hör-Übung: Lautsprecher-Reihe mittig mit etwas Luft */
.qp-skin .spkrow { justify-content: center; gap: 14px; }

/* ==================================================================
   FIXES 06.08.2026 (Handy-Screenshots Nuri):
   1) "Lernen"-Modal ragte rechts raus: Grid-Kinder (mode-card mit
      86-px-Icon) konnten nicht schrumpfen und sprengten die Modal-
      Breite. minmax(0,1fr) + min-width:0 + Overflow-Schutz.
   2) Karten-Liste im Stapel: schöne Zeilen für Kuran-Karten mit
      großem Buchstaben, Name und Prozent-Ring (siehe main.js).
   ================================================================== */
.modal { max-width: min(760px, calc(100vw - 20px)); overflow-x: hidden; }
/* Der Scrim hatte fix 40px Innenabstand — auf schmalen Screens ragte das
   Modal dadurch rechts raus (390px Viewport: 40 + 370 = 410). Jetzt passt
   der Abstand zur Modal-Breite, alles sitzt exakt mittig und bündig. */
@media (max-width: 820px) { .scrim { padding: 10px; } }
.mode-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 820px) { .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }
.modal .mode-card { min-width: 0; }
.modal .qp-modusgrid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } /* (23.09.2026) vorher traf div[style*="grid"] auch Farbpalette und Avatare */

/* Kuran-Kartenzeile: Buchstabe groß · Name · Fortschritts-Ring mit % */
.qcard-row { display: flex; align-items: center; gap: 14px; background: var(--surface, #fff);
  border: 1px solid var(--line, #ECEBE6); border-radius: 16px; padding: 10px 14px; }
.qcard-ar { font-family: 'Scheherazade New', serif; font-weight: 700; font-size: 30px; line-height: 1.7;
  direction: rtl; flex: 0 0 auto; min-width: 52px; text-align: center; color: var(--ink, var(--ink)); }
.qcard-ar.is-long { font-size: 23px; min-width: 0; flex: 0 1 auto; }
.qcard-name { flex: 1 1 auto; min-width: 0; font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; }
.qcard-name small { display: block; font-weight: 600; color: var(--ink-mute, #7a8580); font-size: 11.5px; margin-top: 1px; }
.qcard-ring { flex: 0 0 auto; }
.qcard-ring circle.fg { transition: stroke-dashoffset .6s ease; }
/* Problemkarten: arabische Fragen lesbar groß */
.qcard-ar-inline { font-family: 'Scheherazade New', serif; font-size: 22px !important; line-height: 1.5; direction: rtl; }

/* Kreis-Raster "Dein Fortschritt" (07.08.2026): runde Ringe, die sich GRÜN
   füllen — Buchstabe im Kreis, Name + Prozent darunter. */
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.qgrid-tile { display: grid; justify-items: center; gap: 3px; background: var(--surface, #fff);
  border: 1px solid var(--line, #ECEBE6); border-radius: 16px; padding: 12px 6px 10px;
  transition: transform .12s, box-shadow .12s; }
.qgrid-tile:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(46,36,112,.08); }
.qgrid-tile.is-done { border-color: rgba(27,138,90,.35); background: linear-gradient(180deg, #FDFFFE, #F2FBF6); }
.qring .fg { transition: stroke-dashoffset .6s ease; }
.qring-ar { font-family: 'Scheherazade New', serif; font-weight: 700; font-size: 26px; fill: var(--ink, var(--ink)); }
.qgrid-name { font-weight: 700; font-size: 12.5px; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  /* (23.09.2026) Zwei Zeilen statt „…": Bedeutungen wie „für sie (mehrere) / ihnen gehört"
     passen in keine 92-px-Kachel in einer Zeile. */
  white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; overflow-wrap: anywhere; }
/* Tippen = hören (23.09.2026): die Kachel ist ein Knopf. Sie leuchtet kurz
   violett auf und ein kleiner Lautsprecher erscheint — damit ein Kind SIEHT,
   dass etwas passiert, auch wenn der Ton noch lädt. */
.qgrid-tile { position: relative; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.qgrid-tile:active { transform: scale(.96); }
.qgrid-tile .qgrid-spk { position: absolute; top: 6px; right: 7px; font-size: 12px; opacity: 0; transition: opacity .18s ease, transform .18s var(--e-pop); transform: scale(.6); }
.qgrid-tile.is-spielt { border-color: var(--brand); box-shadow: 0 0 0 3px var(--accent-soft); }
.qgrid-tile.is-spielt .qgrid-spk { opacity: 1; transform: scale(1); }
.qcard-row { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: border-color .18s ease, box-shadow .18s ease; }
.qcard-row.is-spielt { border-color: var(--brand); box-shadow: 0 0 0 3px var(--accent-soft); }
.qgrid-pct { font-weight: 800; font-size: 11.5px; color: var(--ink-mute, #7a8580); }
.qgrid-pct.is-done { color: var(--success, var(--success-3)); }

/* 🎙️ Aussprache-Studio (Klassenzimmer) */
.studio-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px;
  border: 1px solid var(--line, #ECEBE6); border-radius: 12px; background: var(--surface, #fff); }
.studio-ar { font-family: 'Scheherazade New', serif; font-weight: 700; font-size: 26px; line-height: 1.6;
  direction: rtl; flex: 0 0 auto; min-width: 64px; max-width: 40%; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@keyframes recPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(240,32,72,.35); } 50% { box-shadow: 0 0 0 7px rgba(240,32,72,0); } }

/* Problemkarten — dezente Schmalfassung (07.08.2026) */
.weakslim { background: var(--surface, #fff); border: 1px solid var(--line, #ECEBE6);
  border-left: 3px solid var(--gold); border-radius: 12px; padding: 8px 12px; }
.weakslim-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
.weakslim-title { font-size: 13px; font-weight: 700; color: var(--ink, var(--ink)); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.weakslim-title small { color: var(--ink-mute, #7a8580); font-weight: 600; font-size: 11.5px; }
.weakslim-btn { border: 1px solid var(--line, #ECEBE6); background: var(--surface-2, #f6f6f2); border-radius: 999px;
  padding: 4px 12px; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }

.weakslim-caret { color: var(--ink-mute, #7a8580); font-size: 12px; }

/* ---- Regel-Intro-Screens (Video "Kurze Vokale") ---- */
.qi-wrap { position: fixed; inset: 0; z-index: 200; background: linear-gradient(165deg, var(--brand-3) 0%, var(--brand-2) 100%); color: #fff; overflow-y: auto; display: flex; }
/* Die Einführung stand oben und der Knopf ganz unten, dazwischen eine große
   leere Fläche — auf jedem Bildschirm, auf dem der Text kürzer ist als die
   Seite. Das ist der erste Bildschirm jeder Lektion. (11.09.2026)
   Jetzt steht alles zusammen in der Mitte; ist der Text länger als die
   Seite, füllt er sie wie vorher und scrollt. */
.qi-inner { max-width: 560px; width: 100%; margin: 0 auto; padding: 18px 18px 24px; display: flex; flex-direction: column; justify-content: center; min-height: 100%; }
.qi-x { background: none; border: none; color: #FF6B81; font-size: 22px; font-weight: 800; cursor: pointer; padding: 6px; }
.qi-title { text-align: center; font-size: 22px; font-weight: 700; margin: 4px 0 16px; }
.qi-title small { font-weight: 400; font-size: 13px; opacity: .8; }
.qi-info { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 12px; padding: 4px 16px; font-size: 14.5px; margin-bottom: 18px; }
.qi-info p { margin: 10px 0; line-height: 1.55; }
.qi-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
.qi-card { background: #fff; color: var(--ink); border-radius: 12px; padding: 12px 8px; text-align: center; }
.qi-name { font-size: 11px; font-weight: 800; color: var(--brand); letter-spacing: .06em; }
.qi-ar { font-family: 'Scheherazade New', serif; font-size: 34px; line-height: 1.8; font-weight: 700; }
.qi-tr { font-size: 13px; font-style: italic; color: var(--ink-mute); }
.qi-spk { background: var(--brand); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 14px; cursor: pointer; margin-top: 8px; }
.qi-start { background: #fff; color: var(--brand-3); border: none; border-radius: 10px; padding: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; cursor: pointer; width: 100%; margin-top: 20px; }

/* Seitenrahmen für die Vollbild-Module (Suren, Auswendiglernen, Regel-Intro).
   Fehlte bisher komplett — dadurch klebten Text und Knöpfe am Bildschirmrand. */
.content { padding: 0 32px 64px; width: 100%; }
@media (max-width: 720px) { .content { padding: 0 16px 90px; } }

/* ---- Suren-Modul (Elif Be, Nachtausbau P1) ---- */
.sur-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.sur-card { display: flex; align-items: center; gap: 10px; background: var(--card, #fff); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; font: inherit; text-align: left; transition: border-color .15s, transform .12s; }
.sur-card:hover { border-color: var(--brand); transform: translateY(-2px); }

.sur-play:hover { background: var(--brand); color: #fff; }
.sur-stages { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

.inf-miss { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; flex-wrap: wrap; }

/* ---- 🔁 Wiederholungs-Hinweis + 🎤 Nachsprech-Bonus (11.08.2026) ---- */
.replay-note { text-align: center; font-size: 12.5px; font-weight: 800; padding: 5px 12px; background: var(--gold-soft); color: #8a5a06; }
.replay-note.is-none { background: #F2F2F5; color: var(--ink-mute); }

.hz-card { display: block; text-align: left; font: inherit; background: var(--card, #fff); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; cursor: pointer; transition: border-color .15s, transform .12s, box-shadow .15s; }
.hz-card:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(46,36,112,.10); }
.hz-card.is-done { background: var(--success-bg); border-color: var(--success); }
.hz-card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

/* Leiter (Weg durch die Sure) */
.hz-ladder { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
/* (23.09.2026, Nuris Android-Foto) Ein einspaltiges Raster nimmt als Spaltenbreite
   die Mindestbreite seiner Zeilen — und die Verszeile darf nicht umbrechen
   (nowrap). Auf dem Handy wurde jede Zeile so breit wie der längste Vers, die
   Karten liefen rechts hinaus und die ganze Seite ließ sich seitlich schieben.
   minmax(0, 1fr) erlaubt der Spalte, schmaler als ihr Inhalt zu sein; min-width: 0
   auf der Zeile lässt das Flex-Kind dann wirklich abschneiden. Gleiche Vorsorge für
   die anderen einspaltigen Listen der App. */
.hz-step, .cb-row, .kz-zeile, .kz-kind, .kz-lektion, .hz-ord-row { min-width: 0; }
/* Die Verszeile selbst (.hz-step-ar, weiter unten) bricht um statt „…" — ein Vers,
   den das Kind auswendig lernen soll, darf nicht abgeschnitten sein. */
.cb-list, .cb-cheerlist, .kz-lektionen, .kz-verwechslungen, .kz-gruppe, .kz-liste, .hz-ord-done, .hz-ord-pool, .pf-fuss, .inf-rules, .re-extras { grid-template-columns: minmax(0, 1fr); }
.hz-step { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.hz-step.is-done { background: var(--success-bg); border-color: var(--success); }
.hz-step-n { background: var(--accent-soft); color: var(--brand); font-weight: 800; border-radius: 9px; min-width: 30px; height: 30px; display: grid; place-items: center; font-size: 13px; }
.hz-step.is-done .hz-step-n { background: var(--success-bg); color: var(--success-3); }
.hz-step-mid { flex: 1; min-width: 0; }
.hz-step-ar { font-family: 'Scheherazade New', serif; font-size: 22px; line-height: 1.7; font-weight: 700; text-align: right; white-space: normal; overflow-wrap: anywhere; }
.hz-dots { display: flex; gap: 8px; margin-top: 4px; }
.hz-dot { width: 40px; height: 36px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; opacity: .45; filter: grayscale(1); transition: all .15s; }
.hz-dot.is-on { opacity: 1; filter: none; background: var(--success-bg); border-color: var(--success); }
.hz-dot.is-next { opacity: 1; filter: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(46,119,198,.15); }
.hz-step-play { border: none; background: var(--accent-soft); color: var(--brand); border-radius: 8px; width: 40px; height: 40px; cursor: pointer; font-size: 14px; }
.hz-chainrow { background: var(--bg-2); border-radius: 12px; padding: 10px 12px; margin-top: 4px; }
.hz-chain-dots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.hz-cdot { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--brand); }
.hz-cdot.is-on { background: var(--success-bg); border-color: var(--success); color: var(--success-3); }
.hz-cdot.is-big { background: var(--gold-soft); border-color: var(--gold); color: #8a5a06; }

/* Übungs-Bildschirm */
.hz-prac { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 20px 90px; }
@media (max-width: 720px) { .hz-prac { padding: 0 14px 100px; } }
.hz-prac-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.hz-prac-title { flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
.hz-prac-title .muted { font-size: 12px; }
.hz-prac-sub { color: var(--muted, var(--ink-mute)); font-size: 13.5px; margin-bottom: 12px; line-height: 1.5; }
.hz-verse { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; text-align: center; }
.hz-verse.is-hidden { background: var(--bg-2); border-style: dashed; }
.hz-ar { font-family: 'Scheherazade New', serif; font-size: 34px; line-height: 2; font-weight: 700; color: var(--brand); }
.hz-ar-sm { font-size: 26px; line-height: 1.9; }
.hz-tr { color: var(--brand); font-weight: 700; font-size: 15px; margin-top: 4px; }
.hz-de { color: var(--muted, var(--ink-mute)); font-size: 13.5px; margin-top: 3px; }
.hz-prac .qp-btn { margin-top: 10px; }

/* 🎙️ Ton-Tab im Auswendiglernen (12.08.2026) */
.hz-tonbanner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--gold-soft); border: 1px solid #F3D6A8; border-radius: 12px; padding: 11px 14px; margin-top: 12px; font-size: 13.5px; line-height: 1.5; }
.hz-tonbanner .btn { margin-left: auto; }
.hz-ton-row { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 8px; }
.hz-ton-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hz-ton-ar { font-family: 'Scheherazade New', serif; font-size: 26px; line-height: 1.8; font-weight: 700; text-align: right; margin-top: 4px; color: var(--brand); }
.hz-ton-tr { color: var(--brand); font-weight: 700; font-size: 13px; }
.hz-ton-take { margin-top: 8px; background: var(--surface-2, #F7F7F9); border: 1px dashed var(--line); border-radius: 10px; padding: 9px 12px; }
.hz-tts-chip { color: #8a5a06; font-weight: 800; font-size: 11px; }
.hz-rec-chip { color: var(--success-3); font-weight: 800; font-size: 11px; }
/* Zwischenmeldung + Stufen-Anzeige (12.08.2026) */
.hz-toast { max-width: 340px; margin: 120px auto; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 26px 22px; box-shadow: 0 16px 40px rgba(46,36,112,.12); animation: hzToastIn .25s ease; }
@keyframes hzToastIn { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.hz-toast-ico { font-size: 46px; line-height: 1; }
.hz-toast-txt { margin-top: 8px; font-size: 22px; }
.hz-toast-txt b { color: #14603E; }
.hz-toast-txt em { display: block; font-style: normal; font-size: 12.5px; font-weight: 700; color: #8a5a06; margin-top: 2px; }
.hz-toast-sub { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--muted, var(--ink-mute)); }
.hz-stagechips { display: inline-flex; gap: 4px; margin-top: 3px; }
.hz-stagechips em { font-style: normal; font-size: 13px; opacity: .3; filter: grayscale(1); }
.hz-stagechips em.is-done { opacity: .85; filter: none; }
.hz-stagechips em.is-now { opacity: 1; filter: none; transform: scale(1.25); }
/* Mikrofon */
.hz-mic-wrap { text-align: center; margin: 16px 0 4px; }
.hz-mic { width: 92px; height: 92px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--brand), var(--brand)); color: #fff; cursor: pointer; box-shadow: 0 8px 22px rgba(46,36,112,.28); transition: transform .1s; }
.hz-mic:active { transform: scale(.95); }
.hz-mic-ico { font-size: 36px; }
.hz-mic.is-live { background: linear-gradient(135deg, var(--rose), #B3123A); animation: hzPulse 1.15s infinite; }
.hz-mic.is-think { background: var(--ink-mute); }
@keyframes hzPulse { 0% { box-shadow: 0 0 0 0 rgba(240,32,72,.45); } 70% { box-shadow: 0 0 0 22px rgba(240,32,72,0); } 100% { box-shadow: 0 0 0 0 rgba(240,32,72,0); } }
.hz-mic-label { font-weight: 700; font-size: 13.5px; margin-top: 10px; color: var(--muted, var(--ink-mute)); }
.hz-partial { font-family: 'Scheherazade New', serif; font-size: 22px; color: var(--ink-mute); margin-top: 6px; min-height: 30px; }
.hz-err { background: var(--rose-bg); color: #B3123A; border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600; margin-top: 10px; line-height: 1.5; }
.hz-audio { width: 100%; max-width: 320px; margin: 10px auto 6px; display: block; }

.hz-heard { margin-top: 8px; font-size: 12.5px; color: #5a6570; text-align: right; }
.hz-heard span { font-family: 'Scheherazade New', serif; font-size: 18px; }
.hz-onlyar { font-size: 12px; font-weight: 700; color: var(--ink-mute); margin-top: 8px; }
.hz-tempo-hint { font-size: 12.5px; color: var(--muted, var(--ink-mute)); margin-top: 8px; }
.hz-tempo { display: flex; align-items: center; gap: 8px; margin: 10px auto 0; max-width: 280px; font-weight: 800; font-size: 13px; color: var(--brand); }
.hz-tempo-bar { flex: 1; height: 8px; border-radius: 999px; background: #ECEBE6; overflow: hidden; }
.hz-tempo-bar div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #4FC3A1, var(--brand)); transition: width .1s linear; }
.hz-tempo.is-over { color: #B3123A; }
.hz-tempo.is-over .hz-tempo-bar div { background: var(--rose); }
/* Ergebnis */
.hz-result { border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
.hz-result.is-gut { background: var(--success-bg); }
.hz-result.is-fast { background: var(--gold-soft); }
.hz-result.is-nochmal { background: var(--rose-bg); }
.hz-result-head { display: flex; justify-content: space-between; align-items: center; font-size: 15px; margin-bottom: 8px; }
.hz-result-tip { font-size: 13px; margin: 8px 0; line-height: 1.5; }
.hz-feedback { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start; } /* rtl: start = rechts (23.09.2026) */
.hz-fw { font-family: 'Scheherazade New', serif; font-size: 24px; border-radius: 8px; padding: 1px 8px; font-weight: 700; }
.hz-fw.is-ok { background: var(--success); color: #14603E; }
.hz-fw.is-near { background: var(--gold-soft); color: #7a5a06; }
.hz-fw.is-miss { background: var(--rose-bg); color: #8A0E2C; text-decoration: line-through; text-decoration-thickness: 1px; }

/* Puzzle */
.hz-puz { margin-top: 14px; }
.hz-puz-line { min-height: 66px; background: var(--gold-soft); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-start; }
.hz-puz-empty { color: #a08a4a; font-size: 13px; font-weight: 700; width: 100%; text-align: center; direction: ltr; }
.hz-puz-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
.hz-tile { font-family: 'Scheherazade New', serif; font-size: 25px; font-weight: 700; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 12px 4px; line-height: 1.75; cursor: pointer; color: var(--brand); display: inline-flex; flex-direction: column; align-items: center; line-height: 1.35; }
.hz-tile em { font-family: 'Nunito', system-ui, sans-serif; font-style: normal; font-size: 11px; color: var(--muted, var(--ink-mute)); font-weight: 600; }
.hz-tile:hover { border-color: var(--brand); }
.hz-tile.is-set { background: #fff; border-color: var(--success); cursor: default; }
.hz-tile.is-used { visibility: hidden; }
.hz-tile.is-shake { animation: hzShake .4s; border-color: var(--rose); background: var(--rose-bg); }
@keyframes hzShake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

/* Verse ordnen */
.hz-ord-done { display: grid; gap: 6px; margin-bottom: 10px; }
.hz-ord-pool { display: grid; gap: 6px; }
.hz-ord-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: right; font: inherit; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.hz-ord-row.is-set { background: var(--success-bg); border-color: var(--success); cursor: default; }
.hz-ord-row b { background: var(--accent-soft); border-radius: 7px; min-width: 26px; height: 26px; display: grid; place-items: center; font-size: 12px; color: var(--brand); }
.hz-ord-row span { flex: 1; font-family: 'Scheherazade New', serif; font-size: 22px; font-weight: 700; line-height: 1.7; }
.hz-ord-row.is-shake { animation: hzShake .4s; border-color: var(--rose); }

/* Belohnung */
.hz-reward { width: 100%; max-width: 520px; margin: 30px auto; text-align: center; padding: 0 20px 90px; }
.hz-reward-ico { font-size: 74px; line-height: 1; }
.hz-reward h2 { font-family: Fraunces, serif; font-weight: 900; margin: 8px 0; }
.hz-reward-xp { display: inline-block; background: var(--success-bg); color: #14603E; font-weight: 900; font-size: 26px; border-radius: 999px; padding: 6px 22px; margin: 6px 0 4px; }
.hz-reward-sub { font-size: 14px; line-height: 1.7; margin-top: 8px; }

/* ---- Fortschritt: Kuran-Weg-Kacheln (P4) ---- */
.qpr-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.qpr-tile { background: var(--accent-soft); border-radius: 9px; padding: 6px 2px; text-align: center; }
.qpr-tile.is-done { background: var(--success-bg); }
.qpr-tile.is-locked { background: var(--surface-2, #F2F2F5); opacity: .6; }
.qpr-n { font-weight: 800; font-size: 13px; }
.qpr-pct { font-size: 10.5px; font-weight: 700; color: var(--muted, var(--ink-mute)); }

/* ==================================================================
   KOMPAKT-MODUS FÜR KLEINE HANDYS (13.08.2026, Nutzerwunsch: "auf
   kleineren Handys muss man erst runterscrollen, um die Knöpfe zu
   drücken"). Auf kurzen Displays schrumpfen Fragekarte, Schrift und
   Antwort-Knöpfe so weit, dass ALLES ohne Scrollen auf den Schirm
   passt — Bestätigen/Weiter sind immer sofort erreichbar.
   Steht am ENDE des Stylesheets, damit die Höhen-Regeln gewinnen.
   ================================================================== */
